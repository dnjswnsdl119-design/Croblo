<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>크로노스 소울 - ARPG 데모</title>
<style>
  :root{
    --rarity-normal:#c9c9c9;
    --rarity-magic:#4a9eff;
    --rarity-rare:#ffd84a;
    --rarity-set:#3ddc6a;
    --rarity-unique:#ff8c2a;
    --panel-bg:rgba(12,10,18,0.92);
    --panel-border:#5a4a2a;
    --gold:#e8c66a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;user-select:none;}
  #canvas{display:block;width:100%;height:100%;cursor:crosshair;}
  #game-container{position:relative;width:100%;height:100%;}

  .panel{background:var(--panel-bg);border:2px solid var(--panel-border);border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,0.6);}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:14px;left:14px;width:300px;padding:10px 14px;color:#eee;pointer-events:none;}
  #hud .row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  #hud .lvl-badge{background:#2a2010;border:1px solid var(--gold);color:var(--gold);font-weight:bold;font-size:13px;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bar-wrap{flex:1;height:16px;background:#1a1a1a;border:1px solid #444;border-radius:3px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;transition:width 0.25s ease;}
  .bar-hp{background:linear-gradient(180deg,#ff5c5c,#a11d1d);}
  .bar-xp{background:linear-gradient(180deg,#4a9eff,#1d5aa1);}
  .bar-mp{background:linear-gradient(180deg,#3ddcd8,#1a6e6b);}
  .bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;}
  #hud-status-effects{margin-top:6px;font-size:10px;line-height:1.6;}
  #hud-status-effects .fx-line{display:flex;align-items:center;gap:4px;color:#dbe8ff;}
  #hud-status-effects .fx-line .fx-icon{font-size:11px;}
  #hud-status-effects .fx-line .fx-timer{color:#8ad8ff;margin-left:auto;}
  #hud-status-effects .fx-line.debuff{color:#ff9a9a;}
  #hud-status-effects .fx-line.debuff .fx-timer{color:#ff9a9a;}
  #hud-status-effects .fx-line.event{color:#ffd84a;}
  #hud-status-effects .fx-line.event .fx-timer{color:#ffd84a;}
  #gold-display{font-size:13px;color:var(--gold);font-weight:bold;display:flex;align-items:center;gap:4px;}
  #set-bonus-list{margin-top:6px;font-size:11px;color:var(--rarity-set);line-height:1.5;}

  /* ---------- floating text ---------- */
  #fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .dmg-text{position:absolute;font-weight:bold;font-size:15px;color:#fff;text-shadow:0 2px 3px #000;transform:translate(-50%,-50%);animation:floatUp 0.9s ease-out forwards;pointer-events:none;white-space:nowrap;}
  .dmg-text.crit{font-size:20px;color:#ffd84a;}
  .dmg-text.player-hurt{color:#ff5c5c;}
  @keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%);}100%{opacity:0;transform:translate(-50%,-140%);}}

  .aggro-alert{position:absolute;font-weight:900;font-size:26px;color:#ffd84a;text-shadow:0 0 8px #ff8a2a, 0 2px 3px #000;transform:translate(-50%,-50%);animation:aggroPop 0.9s ease-out forwards;pointer-events:none;}
  @keyframes aggroPop{0%{opacity:0;transform:translate(-50%,-30%) scale(0.3);}20%{opacity:1;transform:translate(-50%,-70%) scale(1.3);}35%{transform:translate(-50%,-65%) scale(1);}75%{opacity:1;transform:translate(-50%,-65%) scale(1);}100%{opacity:0;transform:translate(-50%,-90%) scale(0.9);}}

  /* ---------- toasts ---------- */
  #toast-container{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
  .toast{padding:6px 12px;border-radius:4px;background:rgba(10,10,10,0.85);border-left:4px solid var(--rarity-normal);color:#fff;font-size:12px;animation:toastIn 0.25s ease,toastOut 0.4s ease 2.4s forwards;min-width:160px;}
  @keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(20px);}}

  /* ---------- bottom action bar ---------- */
  #bottom-bar{position:absolute;bottom:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:230px;}
  .action-slot.menu-slot{padding:0;font-family:inherit;}
  .action-slot.menu-slot .icon{font-size:18px;}


  /* ---------- inventory panel ---------- */
  #inventory-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:760px;max-width:94vw;max-height:88vh;padding:16px;color:#eee;display:flex;flex-direction:column;}
  #inventory-panel.hidden{display:none;}
  #inv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--panel-border);padding-bottom:8px;gap:10px;flex-shrink:0;}
  #inv-header h2{margin:0;font-size:16px;color:var(--gold);flex:1;}
  #inv-header h2 .inv-count{color:#999;font-size:12px;font-weight:normal;margin-left:6px;}
  #btn-sell-junk{padding:6px 10px;border-radius:5px;border:1px solid var(--panel-border);background:#221d15;color:var(--gold);cursor:pointer;font-size:11px;white-space:nowrap;}
  #btn-sell-junk:hover{background:#332b1e;}
  #junk-threshold-select{padding:6px 6px;border-radius:5px;border:1px solid var(--panel-border);background:#1a1712;color:#ccc;font-size:11px;cursor:pointer;}
  #inv-close{cursor:pointer;color:#aaa;font-size:18px;background:none;border:none;}
  #inv-body{display:flex;gap:18px;min-height:0;flex:1;}
  #equip-column{width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;}
  .equip-slot{height:48px;border:1px dashed #555;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#888;cursor:pointer;position:relative;background:rgba(255,255,255,0.025);transition:background 0.15s, border-color 0.15s;}
  .equip-slot:hover{background:rgba(255,255,255,0.07);}
  .equip-slot .slot-icon{position:absolute;top:3px;right:5px;font-size:11px;opacity:0.5;}
  .equip-slot .slot-label{position:absolute;top:3px;left:5px;font-size:9px;color:#666;}
  .equip-slot.filled{border-style:solid;box-shadow:inset 0 0 10px rgba(255,255,255,0.05);}
  .item-name-small{font-size:10px;text-align:center;padding:0 4px;line-height:1.2;}
  #grid-column{flex:1;display:flex;flex-direction:column;min-width:0;}
  #inv-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;overflow-y:auto;padding-right:4px;align-content:start;flex:1;min-height:180px;max-height:340px;}
  #inv-grid::-webkit-scrollbar{width:7px;}
  #inv-grid::-webkit-scrollbar-track{background:rgba(255,255,255,0.03);border-radius:4px;}
  #inv-grid::-webkit-scrollbar-thumb{background:#4a3f2a;border-radius:4px;}
  #inv-grid::-webkit-scrollbar-thumb:hover{background:var(--gold);}
  .inv-slot{aspect-ratio:1;border:1px solid #3a3a3a;border-radius:6px;background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:3px;transition:background 0.12s, transform 0.12s, box-shadow 0.12s;}
  .inv-slot:hover{background:rgba(255,255,255,0.1);transform:translateY(-1px);}
  .inv-slot.selected{outline:2px solid var(--gold);}
  .inv-slot.filled{background:radial-gradient(circle at 50% 30%, var(--slot-tint,transparent) 0%, rgba(255,255,255,0.02) 75%);}
  .inv-slot .slot-icon{position:absolute;top:2px;left:3px;font-size:10px;opacity:0.55;}
  .inv-slot .item-name-small{color:inherit;}
  .inv-slot .enh-badge{position:absolute;top:1px;right:2px;font-size:9px;color:var(--gold);font-weight:bold;}
  .inv-slot .socket-count-badge{position:absolute;bottom:1px;left:2px;font-size:9px;color:#c77dff;font-weight:bold;}
  .inv-slot.upgrade{box-shadow:0 0 8px rgba(92,255,138,0.55);}
  .inv-slot.upgrade:hover{box-shadow:0 0 12px rgba(92,255,138,0.8);}
  .upgrade-badge{position:absolute;bottom:1px;right:1px;width:16px;height:16px;border-radius:50%;background:#1a3d24;border:1px solid #5cff8a;color:#5cff8a;font-size:10px;line-height:14px;padding:0;cursor:pointer;animation:upgradePulse 1.4s ease-in-out infinite;}
  @keyframes upgradePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
  #char-stats{margin-top:12px;padding-top:10px;border-top:1px solid var(--panel-border);font-size:12px;line-height:1.7;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;}

  /* ---------- detail / enhancement panel ---------- */
  #detail-panel{margin-top:12px;padding-top:10px;border-top:1px solid var(--panel-border);min-height:120px;flex-shrink:0;overflow-y:auto;max-height:280px;}
  #detail-empty{color:#666;font-size:12px;text-align:center;padding:20px 0;}
  #detail-content{display:none;}
  #detail-name{font-size:14px;font-weight:bold;margin-bottom:2px;}
  #detail-type{font-size:11px;color:#999;margin-bottom:8px;}
  #detail-upgrade-hint{font-size:11px;color:#5cff8a;font-weight:bold;margin:-4px 0 8px;}
  #detail-upgrade-hint.hidden{display:none;}
  #btn-equip.upgrade{border-color:#5cff8a;color:#5cff8a;background:rgba(92,255,138,0.1);animation:upgradePulse 1.4s ease-in-out infinite;}
  #detail-stats{font-size:12px;line-height:1.7;color:#bde0bd;}
  #detail-set-info{font-size:11px;color:var(--rarity-set);margin-top:6px;line-height:1.5;}
  #socket-info{margin-top:8px;font-size:11px;color:#c77dff;}
  #socket-info .socket-title{margin-bottom:4px;color:#c77dff;font-weight:bold;}
  .socket-pip{display:inline-block;width:16px;height:16px;border-radius:3px;margin-right:4px;border:1px solid #c77dff;vertical-align:middle;}
  .socket-pip.filled{background:#c77dff;}
  .socket-target-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(199,125,255,0.08);border-radius:5px;margin-bottom:5px;}
  .socket-target-row button{padding:4px 8px;border-radius:4px;border:1px solid #c77dff;background:rgba(199,125,255,0.15);color:#e6c9ff;cursor:pointer;font-size:10px;}
  .socket-target-row button:disabled{opacity:0.3;cursor:not-allowed;}
  #detail-actions{display:flex;gap:8px;margin-top:10px;}
  #detail-actions button{flex:1;padding:8px;border-radius:5px;border:1px solid var(--panel-border);background:#221d15;color:#eee;cursor:pointer;font-size:12px;}
  #detail-actions button:hover{background:#332b1e;}
  #detail-actions button:disabled{opacity:0.4;cursor:not-allowed;}
  #enhance-info{font-size:11px;color:#aaa;margin-top:6px;}
  #enhance-result{font-size:12px;font-weight:bold;margin-top:6px;height:16px;}

  /* ---------- death screen ---------- */
  #death-screen{position:absolute;inset:0;background:rgba(10,0,0,0.75);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ff5c5c;}
  #death-screen.hidden{display:none;}
  #death-screen h1{font-size:42px;letter-spacing:6px;margin-bottom:14px;}
  #death-screen button{padding:10px 24px;background:#3a1414;border:1px solid #ff5c5c;color:#fff;border-radius:6px;cursor:pointer;font-size:14px;}

  #tooltip{position:absolute;pointer-events:none;background:rgba(5,5,10,0.95);border:1px solid var(--panel-border);border-radius:6px;padding:10px 12px;color:#eee;font-size:12px;z-index:50;min-width:160px;line-height:1.6;display:none;}

  #boss-warning{position:absolute;top:80px;left:50%;transform:translate(-50%,-10px);color:var(--rarity-unique);font-size:20px;font-weight:bold;text-shadow:0 2px 4px #000;opacity:0;transition:opacity 0.4s, transform 0.4s;pointer-events:none;}
  #boss-warning.show{opacity:1;transform:translate(-50%,0);}

  #wave-banner{position:absolute;top:130px;left:50%;transform:translate(-50%,-10px);color:#c9a0ff;font-size:18px;font-weight:bold;text-shadow:0 2px 4px #000;opacity:0;transition:opacity 0.4s, transform 0.4s;pointer-events:none;}
  #wave-banner.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- 액션 슬롯 (포션/회피) ---------- */
  #action-slots{position:absolute;bottom:14px;right:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:470px;justify-content:flex-end;}
  #action-slots-left{position:absolute;bottom:122px;left:14px;display:flex;gap:6px;}
  .action-slot{width:48px;height:48px;border-radius:8px;background:rgba(20,16,10,0.9);border:2px solid var(--panel-border);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#eee;position:relative;cursor:pointer;}
  .action-slot .icon{font-size:20px;}
  .action-slot .key{position:absolute;top:2px;left:4px;font-size:9px;color:#999;}
  .action-slot .count{position:absolute;bottom:2px;right:4px;font-size:10px;color:var(--gold);font-weight:bold;}
  .action-slot .cd-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.65);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .action-slot.locked{opacity:0.4;}
  .action-slot .lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .action-slot .rank-badge{position:absolute;bottom:2px;left:4px;font-size:9px;color:var(--gold);font-weight:bold;}

  /* ---------- 화면 전환 ---------- */
  #fade-overlay{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 0.25s ease;z-index:80;}
  #fade-overlay.active{opacity:1;}

  /* ---------- 퀘스트 트래커 ---------- */
  #quest-tracker{position:absolute;top:138px;left:14px;width:280px;padding:8px 12px;color:#eee;font-size:11px;line-height:1.6;pointer-events:none;}
  #quest-tracker.empty{display:none;}
  #quest-tracker .qt-title{color:var(--gold);font-weight:bold;font-size:11px;margin-bottom:4px;}
  #quest-tracker .qt-item{margin-bottom:4px;pointer-events:auto;cursor:pointer;}
  #quest-tracker .qt-item:hover{color:var(--gold);text-decoration:underline;}
  #quest-tracker .qt-item.done{color:#5cff8a;}

  /* ---------- NPC 상호작용 프롬프트 ---------- */
  #npc-prompt{position:absolute;color:#ffe9a8;font-size:12px;font-weight:bold;text-shadow:0 2px 3px #000;pointer-events:none;display:none;white-space:nowrap;transform:translate(-50%,-100%);background:rgba(0,0,0,0.55);padding:3px 8px;border-radius:4px;}

  /* ---------- NPC 대화 패널 ---------- */
  #npc-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:90vw;padding:16px;color:#eee;}
  #npc-panel.hidden{display:none;}
  #npc-panel .npc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px solid var(--panel-border);padding-bottom:8px;}
  #npc-panel .npc-header h2{margin:0;font-size:16px;color:var(--gold);}
  #npc-panel .npc-close{cursor:pointer;color:#aaa;font-size:18px;background:none;border:none;}
  #npc-greeting{font-size:12px;color:#bbb;margin-bottom:12px;font-style:italic;}
  .quest-card{border:1px solid var(--panel-border);border-radius:6px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,0.03);transition:background 0.15s;}
  .quest-card[data-qid]:hover{background:rgba(232,198,106,0.08);border-color:var(--gold);}
  .quest-card .q-title{font-weight:bold;font-size:13px;color:var(--gold);margin-bottom:3px;}
  .quest-card .q-desc{font-size:11px;color:#aaa;margin-bottom:6px;}
  .quest-card .q-reward{font-size:11px;color:#8ad8ff;margin-bottom:6px;}
  .quest-card .q-progress{font-size:11px;color:#5cff8a;margin-bottom:6px;}
  .quest-card button{width:100%;padding:7px;border-radius:5px;border:1px solid var(--panel-border);background:#221d15;color:#eee;cursor:pointer;font-size:12px;}
  .quest-card button:hover{background:#332b1e;}
  .quest-card button:disabled{opacity:0.4;cursor:not-allowed;}
  .shop-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--panel-border);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;}
  .shop-row button{padding:6px 12px;border-radius:5px;border:1px solid var(--panel-border);background:#221d15;color:var(--gold);cursor:pointer;font-size:11px;}
  .shop-row button:hover{background:#332b1e;}
  #npc-no-content{color:#666;font-size:12px;text-align:center;padding:10px 0;}

  /* ---------- 퀘스트 로그 패널 ---------- */
  #quest-log-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:90vw;max-height:70vh;overflow-y:auto;padding:16px;color:#eee;}
  #quest-log-panel.hidden{display:none;}
  #quest-log-panel .ql-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;border-bottom:1px solid var(--panel-border);padding-bottom:8px;}
  #quest-log-panel .ql-header h2{margin:0;font-size:16px;color:var(--gold);}
  #quest-log-panel .ql-close{cursor:pointer;color:#aaa;font-size:18px;background:none;border:none;}
  #quest-log-empty{color:#666;font-size:12px;text-align:center;padding:20px 0;}

  /* ---------- 세계관/도감 패널 ---------- */
  #codex-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:480px;max-width:92vw;max-height:74vh;overflow-y:auto;padding:16px;color:#eee;}
  #codex-panel.hidden{display:none;}
  .codex-mon-card{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:rgba(255,255,255,0.04);border-radius:6px;margin-bottom:6px;border-left:3px solid #555;}
  .codex-mon-card.boss{border-left-color:var(--gold);}
  .codex-mon-name{font-size:12px;color:#eee;}
  .codex-mon-stats{font-size:11px;color:#888;}
  .codex-mon-locked{opacity:0.35;}

  /* ---------- 능력치 분배 패널 ---------- */
  #stat-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;max-width:90vw;padding:16px;color:#eee;}
  #stat-panel.hidden{display:none;}
  #stat-points-line{font-size:12px;color:#aad4ff;margin-bottom:10px;}
  #stat-points-count{color:var(--gold);font-weight:bold;}
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;background:rgba(255,255,255,0.04);border-radius:6px;margin-bottom:7px;}
  .stat-row-label{font-size:12px;color:#eee;}
  .stat-row-desc{font-size:10px;color:#888;margin-top:2px;}
  .stat-row-val{font-size:13px;color:var(--gold);width:28px;text-align:center;}
  .stat-row-btn{width:26px;height:26px;border-radius:4px;background:rgba(232,198,106,0.18);border:1px solid var(--gold);color:var(--gold);cursor:pointer;font-size:14px;}
  .stat-row-btn:disabled{opacity:0.25;cursor:not-allowed;}

  /* ---------- 스킬트리 패널 ---------- */
  #skilltree-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:420px;max-width:92vw;max-height:82vh;overflow-y:auto;padding:16px;color:#eee;}
  #skilltree-panel.hidden{display:none;}
  #skilltree-points-line{font-size:12px;color:#aad4ff;margin-bottom:10px;}
  #skilltree-points-count{color:var(--gold);font-weight:bold;}
  .skill-row{padding:10px;background:rgba(255,255,255,0.04);border-radius:7px;margin-bottom:8px;border:1px solid var(--panel-border);}
  .skill-row.maxed{border-color:var(--gold);}
  .skill-row-top{display:flex;align-items:center;gap:8px;}
  .skill-row-icon{font-size:20px;}
  .skill-row-name{font-size:13px;font-weight:bold;color:#eee;flex:1;}
  .skill-row-rank{font-size:12px;color:var(--gold);}
  .skill-row-desc{font-size:11px;color:#999;margin:4px 0;}
  .skill-row-req{font-size:10px;color:#8ad8ff;margin-bottom:6px;}
  .skill-row-req.unmet{color:#ff8a8a;}
  .skill-row-btn{width:100%;padding:7px;border-radius:5px;border:1px solid var(--gold);background:rgba(232,198,106,0.12);color:var(--gold);cursor:pointer;font-size:12px;}
  .skill-row-btn:disabled{opacity:0.3;cursor:not-allowed;border-color:#555;color:#888;}
  #stat-points-badge, #skill-points-badge{display:inline-block;min-width:16px;height:16px;padding:0 3px;margin-left:4px;background:#e33;color:#fff;border-radius:8px;font-size:10px;line-height:16px;text-align:center;vertical-align:middle;}
  #stat-points-badge.hidden, #skill-points-badge.hidden{display:none;}

  /* ---------- 조합 패널 ---------- */
  #combine-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:460px;max-width:92vw;max-height:82vh;overflow-y:auto;padding:16px;color:#eee;}
  #travel-panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:360px;max-width:92vw;padding:16px;color:#eee;}

<script type="module">
import * as THREE from 'three';
/* =========================================================================
   크로노스 소울 - 작은 ARPG 데모
   디아블로 / 리니지 / 크로노스 스타일의 탑뷰 액션 RPG
   ========================================================================= */

/* ---------------------------- 데이터 정의 ---------------------------- */

const RARITY = {
  normal:  { key:'normal',  label:'일반',   color:'#c9c9c9', mult:1.0,  weight:550 },
  magic:   { key:'magic',   label:'마법',   color:'#4a9eff', mult:1.4,  weight:290 },
  rare:    { key:'rare',    label:'희귀',   color:'#ffd84a', mult:2.0,  weight:110 },
  set:     { key:'set',     label:'세트',   color:'#3ddc6a', mult:1.8,  weight:35  },
  unique:  { key:'unique',  label:'유니크', color:'#ff8c2a', mult:2.8,  weight:15  },
  rune:    { key:'rune',    label:'룬',     color:'#c77dff', mult:1.0,  weight:0   },
  gem:     { key:'gem',     label:'보석',   color:'#ff8ccf', mult:1.0,  weight:0   },
  fusion:  { key:'fusion',  label:'각인석', color:'#ffb347', mult:1.0,  weight:0   },
};

const SLOT_LABEL = { weapon:'무기', armor:'방어구', accessory:'장신구', helmet:'투구', gloves:'장갑', boots:'신발', belt:'벨트', rune:'룬', gem:'보석', fusion:'각인석' };

/* ---------------------------- 유틸 함수 ---------------------------- */

function rand(min,max){ return Math.random()*(max-min)+min; }
function hexToRgba(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}
function randi(min,max){ return Math.floor(rand(min,max+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }

/* ---------------------------- 효과음 (Web Audio) ---------------------------- */

let actx = null;
function getAudioCtx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state === 'suspended') actx.resume();
  return actx;
}
window.addEventListener('pointerdown', ()=>getAudioCtx(), { once:true });
window.addEventListener('keydown', ()=>getAudioCtx(), { once:true });

function tone(freq, dur, type, vol, startDelay, freqEnd){
  try{
    const ctx = getAudioCtx();
    const t0 = ctx.currentTime + (startDelay||0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if(freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), t0+dur);
    gain.gain.setValueAtTime(vol||0.15, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }catch(e){/* 오디오 미지원 환경은 무시 */}
}

function weightedRarity(){
  const total = Object.values(RARITY).reduce((s,r)=>s+r.weight,0);
  let roll = Math.random()*total;
  for(const r of Object.values(RARITY)){
    if(roll < r.weight) return r.key;
    roll -= r.weight;
  }
  return 'normal';
}

let itemUid = 1;
let gameLoaded = false; // loadGame()이 끝나기 전까지 저장을 막아 세이브 파일이 덮어써지는 것을 방지

const SOCKET_COUNT_BY_RARITY = { normal:0, magic:1, rare:2, set:4, unique:6 };

function createRandomItem(){
  const rarityKey = weightedRarity();

  if(rarityKey === 'set'){
    const setDef = choice(Object.values(SETS));
    const slot = choice(Object.keys(setDef.pieces));
    const piece = setDef.pieces[slot];
    return {
      uid: itemUid++,
      name: piece.name,
      slot, rarity:'set', setId: setDef.id, setName: setDef.name,
      base: {...piece.base}, enhance:0,
      sockets: SOCKET_COUNT_BY_RARITY.set, runes:[],
    };
  }
  if(rarityKey === 'unique'){
    const u = choice(UNIQUES);
    return {
      uid: itemUid++, name:u.name, slot:u.slot, rarity:'unique',
      base:{...u.base}, flavor:u.flavor, enhance:0,
      sockets: SOCKET_COUNT_BY_RARITY.unique, runes:[],
    };
  }

  // normal / magic / rare -> procedural
  const slot = choice(EQUIP_SLOT_POOL);
  const rarityDef = RARITY[rarityKey];
  const baseName = choice(NORMAL_NAMES[slot]);
  let name = baseName;
  let base = {};

  const primaryStat = PRIMARY_STAT_BY_SLOT[slot];
  const primaryVal = Math.round(rand(3,7) * rarityDef.mult);
  base[primaryStat] = primaryVal;

  if(rarityKey === 'magic'){
    name = `${choice(AFFIX_PREFIX.magic)} ${baseName}`;
    const affix = choice(AFFIX_POOL.filter(a=>a!==primaryStat));
    base[affix] = (base[affix]||0) + Math.round(rand(2,5));
  } else if(rarityKey === 'rare'){
    name = `${choice(AFFIX_PREFIX.rare)} ${baseName}`;
    const pool = AFFIX_POOL.filter(a=>a!==primaryStat);
    const n = randi(2,3);
    for(let i=0;i<n && i<pool.length;i++){
      base[pool[i]] = (base[pool[i]]||0) + Math.round(rand(3,7));
    }
  }

  return { uid:itemUid++, name, slot, rarity:rarityKey, base, enhance:0,
    sockets: SOCKET_COUNT_BY_RARITY[rarityKey]||0, runes:[] };
}

// 룬 조합 순서: 같은 룬 3개를 모으면 다음 단계 룬 1개로 조합할 수 있다 (조드 룬이 최종 단계)
const RUNE_ORDER = ['el','tir','ral','ort','sol','zod'];

function createRuneItem(runeId){
  const r = RUNES[runeId];
  return { uid:itemUid++, name:r.name, slot:'rune', rarity:'rune', runeId, base:{}, enhance:0 };
}

function dropRandomRune(x, z){
  // 상위 룬일수록 드랍 확률이 낮음 (조드 룬은 드랍되지 않고 조합으로만 획득 가능)
  const dropPool = RUNE_ORDER.slice(0, -1);
  const weights = [40, 28, 18, 10, 4];
  let roll = Math.random()*weights.reduce((a,b)=>a+b,0);
  let runeId = dropPool[0];
  for(let i=0;i<dropPool.length;i++){
    if(roll < weights[i]){ runeId = dropPool[i]; break; }
    roll -= weights[i];
  }
  const item = createRuneItem(runeId);
  spawnLoot(item, x, z);
}

// 디아블로 스타일 보석: 룬과 마찬가지로 소켓에 삽입 가능. 등급(하급~완벽)이 오를수록 효과가 커진다.
const GEM_TIERS = ['chipped','normal','flawless','perfect'];
const GEM_TIER_LABELS = { chipped:'하급', normal:'보통', flawless:'상급', perfect:'완벽' };
const GEM_TIER_MULT = { chipped:1, normal:1.8, flawless:3, perfect:5 };
const GEMS = {
  ruby:     { id:'ruby',     name:'루비',     color:'#ff4a4a', stat:'atk',  base:3 },
  sapphire: { id:'sapphire', name:'사파이어', color:'#4a8aff', stat:'def',  base:3 },
  emerald:  { id:'emerald',  name:'에메랄드', color:'#3ddc6a', stat:'crit', base:1.2 },
  topaz:    { id:'topaz',    name:'토파즈',   color:'#ffd84a', stat:'hp',   base:18 },
};
const GEM_STAT_LABELS = { atk:'공격력', def:'방어력', crit:'치명타%', hp:'체력' };

function createGemItem(gemId, tier){
  const g = GEMS[gemId];
  return { uid:itemUid++, name:`${GEM_TIER_LABELS[tier]} ${g.name}`, slot:'gem', rarity:'gem', gemId, tier, base:{}, enhance:0 };
}

function gemStatValue(gemId, tier){
  return GEMS[gemId].base * GEM_TIER_MULT[tier];
}

function dropRandomGem(x, z){
  // 하급 보석만 드랍, 상위 등급은 조합으로만 획득 가능
  const gemId = choice(Object.keys(GEMS));
  const item = createGemItem(gemId, 'chipped');
  spawnLoot(item, x, z);
}

// 보석 + 룬 융합: 각각의 스탯을 하나로 합친 "각인석" 생성 (조합 시스템)
function computeFusionStats(gemItem, runeItem){
  const g = GEMS[gemItem.gemId];
  const gemVal = gemStatValue(gemItem.gemId, gemItem.tier);
  const rs = RUNES[runeItem.runeId].stats;
  const stats = { atk:rs.atk||0, def:rs.def||0, hp:rs.hp||0, crit:rs.crit||0 };
  stats[g.stat] += gemVal;
  stats.atk = Math.round(stats.atk); stats.def = Math.round(stats.def); stats.hp = Math.round(stats.hp);
  stats.crit = Math.round(stats.crit*10)/10;
  return stats;
}
function createFusionItem(gemItem, runeItem){
  const stats = computeFusionStats(gemItem, runeItem);
  const name = `${GEMS[gemItem.gemId].name}-${RUNES[runeItem.runeId].name.replace(' 룬','')} 각인석`;
  return { uid:itemUid++, name, slot:'fusion', rarity:'fusion', fusionStats:stats, base:{}, enhance:0,
    flavor:`${gemItem.name}과(와) ${runeItem.name}의 힘이 하나로 융합되었다.` };
}

// 강화 레벨에 따른 실제 스탯 (강화 1레벨당 기본 스탯의 12% 증가, crit은 +0.5/레벨)
function getScaledStats(item){
  const out = {};
  const mult = 1 + item.enhance*0.12;
  for(const k in item.base){
    if(k==='crit'){ out[k] = item.base[k] + item.enhance*0.5; }
    else { out[k] = Math.round(item.base[k]*mult); }
  }
  return out;
}

// 장비 비교용 대략적인 "전투력" 점수: 서로 다른 스탯 구성의 장비를 대충 비교하기 위한 가중합
const SOCKETABLE_SLOTS = ['rune','gem','fusion'];
function computeItemPower(item){
  if(!item || SOCKETABLE_SLOTS.includes(item.slot)) return 0;
  const s = getScaledStats(item);
  return (s.atk||0)*2 + (s.def||0)*2 + (s.hp||0)*0.3 + (s.crit||0)*3;
}

// 파밍한 아이템이 현재 장착 중인 같은 부위 장비보다 강한지 (즉시 장착 추천 여부)
function isUpgrade(item){
  if(!item || SOCKETABLE_SLOTS.includes(item.slot)) return false;
  const equipped = player.equipment[item.slot];
  if(!equipped) return true;
  return computeItemPower(item) > computeItemPower(equipped);
}

  if(level < 5) return 0.95;
  if(level < 8) return 0.80;
  if(level < 11) return 0.60;
  if(level < 13) return 0.40;
  return 0.25;
}

function getSkillRankScale(rank){
  const r = Math.max(1, rank);
  return { power: 1+(r-1)*0.15, cd: 1-(r-1)*0.08, cost: 1-(r-1)*0.05 };
}

const POTION_HEAL_PCT = 0.35;

function getTotalStats(){
  const stats = { hp:player.baseHp, atk:player.baseAtk, def:player.baseDef, crit:player.baseCrit };
  const alloc = player.allocatedStats;
  stats.atk += (alloc.str||0)*1;
  stats.crit += (alloc.agi||0)*0.3;
  stats.hp += (alloc.vit||0)*4;
  for(const slot in player.equipment){
    const item = player.equipment[slot];
    if(!item) continue;
    const s = getScaledStats(item);
    stats.atk += s.atk||0; stats.def += s.def||0; stats.hp += s.hp||0; stats.crit += s.crit||0;
    if(item.runes && item.runes.length){
      for(const runeId of item.runes){
        const rs = RUNES[runeId]?.stats;
        if(!rs) continue;
        stats.atk += rs.atk||0; stats.def += rs.def||0; stats.hp += rs.hp||0; stats.crit += rs.crit||0;
      }
    }
    if(item.gems && item.gems.length){
      for(const g of item.gems){
        const def = GEMS[g.gemId];
        if(!def) continue;
        stats[def.stat] += gemStatValue(g.gemId, g.tier);
      }
    }
    if(item.fusions && item.fusions.length){
      for(const f of item.fusions){
        stats.atk += f.atk||0; stats.def += f.def||0; stats.hp += f.hp||0; stats.crit += f.crit||0;
      }
    }
  }
  const setCounts = {};
  for(const slot in player.equipment){
    const item = player.equipment[slot];
    if(item && item.setId) setCounts[item.setId] = (setCounts[item.setId]||0)+1;
  }
  const activeSetBonuses = [];
  for(const setId in setCounts){
    const setDef = SETS[setId];
    for(const bonus of setDef.bonuses){
      if(setCounts[setId] >= bonus.count){
        stats.atk += bonus.stats.atk||0; stats.def += bonus.stats.def||0;
        stats.hp += bonus.stats.hp||0; stats.crit += bonus.stats.crit||0;
        activeSetBonuses.push(`${setDef.name} ${bonus.desc}`);
      }
    }
  }
  if(player.buffTimers.atk > 0) stats.atk = Math.round(stats.atk*player.buffs.atkMult);
  if(player.buffTimers.def > 0) stats.def = Math.round(stats.def*player.buffs.defMult);
  if(player.rebirths > 0){
    const rebirthMult = 1 + player.rebirths*REBIRTH_BONUS_PCT/100;
    stats.atk = Math.round(stats.atk*rebirthMult);
    stats.def = Math.round(stats.def*rebirthMult);
    stats.hp = Math.round(stats.hp*rebirthMult);
  }
  stats._activeSetBonuses = activeSetBonuses;
  return stats;
}

function addXP(amount){
  player.xp += amount;
  while(player.xp >= player.xpToNext){
    player.xp -= player.xpToNext;
    player.level++;
    const g = getClassDef()?.growth || { hp:20, atk:3, def:1, crit:0, mp:5 };
    player.baseHp += Math.round(g.hp); player.baseAtk += Math.round(g.atk);

let lastInvFullToast = 0;
let lastJunkPromptTime = -Infinity;
let junkPromptOpen = false;
function warnInventoryFull(){
  const now = performance.now();
  if(now - lastInvFullToast > 4000){
    lastInvFullToast = now;
    spawnToast('인벤토리가 가득 찼습니다', '#888');
  }
  if(junkPromptOpen || now - lastJunkPromptTime < 20000) return;
  if(invPanel && !invPanel.classList.contains('hidden')) return;
  const maxTier = RARITY_TIER[player.junkThreshold];
  const junkCount = player.inventory.filter(i=>RARITY_TIER[i.rarity] !== undefined && RARITY_TIER[i.rarity] <= maxTier).length;
  if(junkCount === 0) return;
  lastJunkPromptTime = now;
  junkPromptOpen = true;
  showConfirm(`인벤토리가 가득 찼습니다. ${RARITY[player.junkThreshold].label} 등급 이하 잡템 ${junkCount}개를 지금 정리할까요?`, ()=>{
    junkPromptOpen = false;
    sellJunkItems();
  }, ()=>{ junkPromptOpen = false; });
}

function addItemToInventory(item){
  if(player.inventory.length >= MAX_INVENTORY){
    warnInventoryFull();
    return false;
  }
  player.inventory.push(item);
  const rc = RARITY[item.rarity].color;
  if(isUpgrade(item)){
    spawnToast(`⬆ 업그레이드! ${item.name} (인벤토리에서 즉시 장착 가능)`, '#5cff8a');
  } else {
    spawnToast(`획득: ${item.name}`, rc);
  }
  SFX.pickup();
  return true;
}

function addPotion(amount){
  player.potions = Math.min(MAX_POTIONS, player.potions + amount);
  spawnToast(`포션 획득 (${player.potions}개 보유)`, '#ff6a6a');
  SFX.pickup();
  refreshHUD();
}

function usePotion(){
  if(!player.alive || player.potions <= 0) return;
  const stats = getTotalStats();
  if(player.hp >= stats.hp){ spawnToast('체력이 이미 가득 찼습니다','#888'); return; }
  player.potions--;
  player.hp = Math.min(stats.hp, player.hp + Math.round(stats.hp*POTION_HEAL_PCT));
  const wp = playerState.pos.clone(); wp.y = 2.2;
  spawnDamageNumberAt(wp, `+${Math.round(stats.hp*POTION_HEAL_PCT)}`, false, '#5cff8a');
  SFX.potion();
  refreshHUD();
}

// 한글 IME 등 입력기가 켜져 있으면 e.key가 자판 배열/조합 상태에 따라 달라질 수 있으므로,
// 물리적 키 위치를 나타내는 e.code를 우선 사용한다 (레이아웃/IME 영향 없음).
// e.code를 지원하지 않는 일부 환경을 위해 e.key도 보조로 함께 확인한다.
function matchKey(e, code, key){
  return e.code === code || (!!e.key && e.key.toLowerCase() === key);
}

const keysPressed = new Set();
const MOVE_CODES = new Set(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
const KEY_TO_MOVE_CODE = { w:'KeyW', a:'KeyA', s:'KeyS', d:'KeyD', arrowup:'ArrowUp', arrowdown:'ArrowDown', arrowleft:'ArrowLeft', arrowright:'ArrowRight' };
function resolveMoveCode(e){
  if(MOVE_CODES.has(e.code)) return e.code;
  return KEY_TO_MOVE_CODE[(e.key||'').toLowerCase()] || null;
}
window.addEventListener('keydown', (e)=>{
  const mc = resolveMoveCode(e);
  if(mc){ keysPressed.add(mc); if(mc.startsWith('Arrow')) e.preventDefault(); }
});
window.addEventListener('keyup', (e)=>{
  const mc = resolveMoveCode(e);
  if(mc) keysPressed.delete(mc);
});

// 카메라가 45도 회전된 아이소메트릭 시점이므로, 방향키 입력을 화면 기준
// 수직/수평으로 보이도록 월드 좌표계에서 45도 회전시켜 매핑한다.
const ISO_FORWARD = { x:-0.70710678, z:-0.70710678 }; // 화면상 "위" (Up)
const ISO_RIGHT   = { x: 0.70710678, z:-0.70710678 }; // 화면상 "오른쪽" (Right)

function getKeyboardMoveDir(){
  let f=0, r=0;
  if(keysPressed.has('KeyW')||keysPressed.has('ArrowUp')) f += 1;
  if(keysPressed.has('KeyS')||keysPressed.has('ArrowDown')) f -= 1;
  if(keysPressed.has('KeyA')||keysPressed.has('ArrowLeft')) r -= 1;
  if(keysPressed.has('KeyD')||keysPressed.has('ArrowRight')) r += 1;
  if(f===0 && r===0) return null;
  const x = f*ISO_FORWARD.x + r*ISO_RIGHT.x;
  const z = f*ISO_FORWARD.z + r*ISO_RIGHT.z;
  return new THREE.Vector3(x,0,z).normalize();
}

function flashSkillEffect(pos, colorHex, maxRadius){

  const ring = new THREE.Mesh(new THREE.RingGeometry(0.1,0.4,24), new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.8, side:THREE.DoubleSide}));
  ring.rotation.x = -Math.PI/2;

function spawnCastBolt(fromPos, toPos, colorHex){
  const color = new THREE.Color(colorHex);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.7}));
  const start = fromPos.clone(); start.y = 1.2;
  const end = toPos.clone(); end.y = 1.2;
  mesh.position.copy(start);
  scene.add(mesh);
  const t0 = performance.now();
  (function anim(){
    const t = Math.min(1, (performance.now()-t0)/180);
    mesh.position.lerpVectors(start, end, t);
    if(t >= 1){ scene.remove(mesh); return; }
    requestAnimationFrame(anim);
  })();
}

function useClassSkill(slotKey){
  if(!player.classId || !player.alive || playerState.dodging) return;
  const cls = getClassDef();
  const skill = cls.skills[slotKey];
  const state = skillState[slotKey];
  if(state.cd > 0) return;
  const rank = player.skillRanks[slotKey] || 0;
  if(rank <= 0){ spawnToast('아직 배우지 않은 스킬입니다 (V: 스킬트리)', '#888'); return; }
  const scale = getSkillRankScale(rank);
  const cost = Math.round((skill.cost||0) * scale.cost);
  if(player.mp < cost){ spawnToast('마력이 부족합니다', '#888'); return; }

  const isSingle = skill.type === 'melee_single' || skill.type === 'ranged_single';
  const isAoe = skill.type === 'melee_aoe' || skill.type === 'ranged_aoe';
  let target = null;
  if(isSingle || isAoe){
    const range = skill.type.startsWith('ranged') ? (cls.range||8) : 3.4;
    target = (playerState.targetMonster && playerState.targetMonster.alive && playerState.pos.distanceTo(playerState.targetMonster.pos) < range) ? playerState.targetMonster : findNearestMonster(range);
    if(isSingle && !target){ spawnToast('사거리 내에 대상이 없습니다', '#888'); return; }
  }

  if(playerState.mounted) toggleMount();
  state.cd = skill.cdMax * scale.cd;
  player.mp = Math.max(0, player.mp - cost);
  const stats = getTotalStats();
  const mult = (skill.mult||0) * scale.power;

  if(isSingle){
    const isCrit = Math.random()*100 < stats.crit;
    let dmg = Math.max(1, Math.round(stats.atk*mult*rand(0.9,1.1) - target.def.def*0.5*getDefPenetration()));
    if(isCrit) dmg = Math.round(dmg*1.8);
    target.hp -= dmg;
    const wp = target.pos.clone(); wp.y = 2.2*target.def.scale;
    spawnDamageNumberAt(wp, dmg, true, '#ff8a2a');
    updateMonsterBar(target);
    flashSkillEffect(target.pos, 0xff8a2a, 1.6);
    if(skill.type==='ranged_single') spawnCastBolt(playerState.pos, target.pos, 0x8a5aff);
    SFX.crit();
    if(target.hp <= 0) killMonster(target);
  } else if(isAoe){
    const center = target ? target.pos : playerState.pos;
    const radius = skill.radius || 3.6;
    const nearby = monsters.filter(m=>m.alive && center.distanceTo(m.pos) < radius);
    if(nearby.length === 0){ spawnToast('주변에 대상이 없습니다', '#888'); }
    nearby.forEach(m=>{
      const isCrit = Math.random()*100 < stats.crit;
      let dmg = Math.max(1, Math.round(stats.atk*mult*rand(0.9,1.1) - m.def.def*0.5*getDefPenetration()));
      if(isCrit) dmg = Math.round(dmg*1.8);
      m.hp -= dmg;
      const wp = m.pos.clone(); wp.y = 2.0*m.def.scale;
      spawnDamageNumberAt(wp, dmg, isCrit, '#4ad0ff');
      updateMonsterBar(m);
      if(m.hp <= 0) killMonster(m);
    });
    flashSkillEffect(center, 0x4ad0ff, radius);
    if(skill.type==='ranged_aoe') spawnCastBolt(playerState.pos, center, 0x8a5aff);
    SFX.crit();
  } else if(skill.type === 'buff_def'){
    player.buffs.defMult = 1+skill.bonus*scale.power;
    player.buffTimers.def = skill.duration;
    spawnToast(`${skill.name}! 방어력 증가`, '#8ad8ff');
    SFX.levelup();
  } else if(skill.type === 'buff_atk_heal'){
    player.buffs.atkMult = 1+skill.atkBonus*scale.power;
    player.buffTimers.atk = skill.duration;
    const heal = Math.round(stats.hp*skill.healPct);
    player.hp = Math.min(stats.hp, player.hp+heal);
    spawnToast(`${skill.name}! 공격력 증가 + 체력 회복`, '#8ad8ff');
    SFX.levelup();
  } else if(skill.type === 'buff_speed'){
    player.buffs.speedMult = 1+(skill.mult-1)*scale.power;
    player.buffTimers.speed = skill.duration;
    spawnToast(`${skill.name}! 이동속도 증가`, '#8ad8ff');
    SFX.dodge();
  } else if(skill.type === 'buff_shield'){
    player.buffs.dmgReduction = skill.reduction*scale.power;
    player.buffTimers.dmgReduction = skill.duration;
    spawnToast(`${skill.name}! 피해 감소`, '#8ad8ff');
    SFX.levelup();
  }
  refreshHUD();
}

// 기본 공격 단축키: 무기 데미지 그대로, 락온 없이 사거리 내 가장 가까운 적을 즉시 공격
const basicAttackState = { cd:0, cdMax:0.7 };
function useBasicAttackHotkey(){
  if(!player.classId || !player.alive || playerState.dodging) return;
  if(basicAttackState.cd > 0) return;
  const range = getAttackRange();
  const target = (playerState.targetMonster && playerState.targetMonster.alive && playerState.pos.distanceTo(playerState.targetMonster.pos) < range)
    ? playerState.targetMonster : findNearestMonster(range);
  if(!target){ spawnToast('사거리 내에 대상이 없습니다', '#888'); return; }
  if(playerState.mounted) toggleMount();
  facePosition(target.pos);
  basicAttackState.cd = basicAttackState.cdMax;
  playerState.attackCooldown = basicAttackState.cdMax;
  playerAttack(target);
}

// 4번 스킬: 악령 소환 (전 직업 공용) - 느리게 전진하며 경로상의 모든 적을 지속 타격
const EVIL_SPIRIT = { name:'악령 소환', cdMax:9, cost:30, speed:4.5, radius:1.8, tickInterval:0.35, dmgMult:0.85, lifeDistance:18 };
let evilSpirits = [];

function useEvilSpirit(){
  if(!player.classId || !player.alive) return;
  if(skillState.s4.cd > 0) return;
  if(player.mp < EVIL_SPIRIT.cost){ spawnToast('마력이 부족합니다', '#888'); return; }
  let dir;
  const target = (playerState.targetMonster && playerState.targetMonster.alive) ? playerState.targetMonster : findNearestMonster(20);
  if(target){
    dir = new THREE.Vector3().subVectors(target.pos, playerState.pos); dir.y = 0;
  } else {
    dir = playerState.facing.clone();
  }
  if(dir.lengthSq() < 0.0001) dir = playerState.facing.clone();
  dir.normalize();
  skillState.s4.cd = EVIL_SPIRIT.cdMax;
  player.mp = Math.max(0, player.mp - EVIL_SPIRIT.cost);
  spawnEvilSpirit(playerState.pos.clone(), dir);
  spawnToast('악령 소환!', '#aa66ff');
  SFX.crit();
  refreshHUD();
}

function spawnEvilSpirit(startPos, dir){
  const color = new THREE.Color(0x6a2a9a);
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.38,10,10), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.85, transparent:true, opacity:0.85}));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55,0.07,8,16), new THREE.MeshBasicMaterial({color:0xaa66ff, transparent:true, opacity:0.6}));
  ring.rotation.x = Math.PI/2;
  g.add(core, ring);
  g.position.copy(startPos); g.position.y = 1.3;
  scene.add(g);
  evilSpirits.push({ mesh:g, pos:startPos.clone(), dir, traveled:0, tickTimer:0 });
}

function updateEvilSpirits(dt){
  for(let i=evilSpirits.length-1; i>=0; i--){
    const s = evilSpirits[i];
    const step = EVIL_SPIRIT.speed*dt;
    s.pos.x += s.dir.x*step; s.pos.z += s.dir.z*step;
    s.traveled += step;
    s.mesh.position.x = s.pos.x; s.mesh.position.z = s.pos.z;
    s.mesh.rotation.y += dt*4;

    s.tickTimer -= dt;
    if(s.tickTimer <= 0){
      s.tickTimer = EVIL_SPIRIT.tickInterval;
      const stats = getTotalStats();
      monsters.filter(m=>m.alive && s.pos.distanceTo(m.pos) < EVIL_SPIRIT.radius).forEach(m=>{
        const isCrit = Math.random()*100 < stats.crit;
        let dmg = Math.max(1, Math.round(stats.atk*EVIL_SPIRIT.dmgMult*rand(0.9,1.1) - m.def.def*0.4));
        if(isCrit) dmg = Math.round(dmg*1.8);
        m.hp -= dmg;
        const wp = m.pos.clone(); wp.y = 2.0*m.def.scale;
        spawnDamageNumberAt(wp, dmg, isCrit, '#aa66ff');
        updateMonsterBar(m);
        if(m.hp <= 0) killMonster(m);
      });
    }

    if(s.traveled >= EVIL_SPIRIT.lifeDistance || collides(s.pos.x, s.pos.z, 0.3)){
      scene.remove(s.mesh);
      evilSpirits.splice(i,1);
    }
  }
}

window.addEventListener('keydown', (e)=>{
  if(matchKey(e,'Digit1','1')) useClassSkill('s1');
  if(matchKey(e,'Digit2','2')) useClassSkill('s2');
  if(matchKey(e,'Digit3','3')) useClassSkill('s3');
  if(matchKey(e,'Digit4','4')) useEvilSpirit();
  if(matchKey(e,'Digit5','5')) useClassSkill(getActiveUltimateKey());
  if(matchKey(e,'KeyZ','z')) useBasicAttackHotkey();
});

function updateWeaponVisual(){
  const w = player.equipment.weapon;
  const mesh = playerMesh.userData.weaponMesh;
  if(!mesh) return;
  const tints = mesh.userData.tintMeshes || [mesh];
  if(!w){
    tints.forEach(m=>{ m.material.color.set(0xdddddd); m.material.emissive.set(0x000000); });
    return;
  }
  const c = new THREE.Color(RARITY[w.rarity].color);
  tints.forEach(m=>{
    m.material.color.set(c);
    m.material.emissive.set(c); m.material.emissiveIntensity = 0.35;
  });
}

function makePetMesh(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.25,0.35,4,8), new THREE.MeshStandardMaterial({color:0x4a7aa8}));
  body.position.y = 0.35; body.castShadow = true;
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.18,0.3,6), new THREE.MeshStandardMaterial({color:0x4a7aa8}));
  head.position.y = 0.58; head.castShadow = true;
  g.add(body,head);
  return g;
}
const petMesh = makePetMesh();
petMesh.position.set(1.2,0,1.2);
scene.add(petMesh);
const petState = {
  pos: new THREE.Vector3(1.2,0,1.2),
  followOffset: new THREE.Vector3(-1.2,0,0.8),
  attackCooldown: 0,
};

function updatePet(dt){
  if(!player.alive) return;
  const targetPos = playerState.pos.clone().add(petState.followOffset);
  const dir = new THREE.Vector3().subVectors(targetPos, petState.pos); dir.y = 0;
  const dist = dir.length();
  if(dist > 0.3){
    dir.normalize();
    const step = Math.min(dist, 9*dt);
    petState.pos.x += dir.x*step; petState.pos.z += dir.z*step;
    petMesh.rotation.y = Math.atan2(dir.x,dir.z);
  }
  petMesh.position.copy(petState.pos);

  petState.attackCooldown -= dt;
  if(petState.attackCooldown <= 0){
    const target = (playerState.targetMonster && playerState.targetMonster.alive) ? playerState.targetMonster : findNearestMonster(6);
    if(target && petState.pos.distanceTo(target.pos) < 6.5){
      petState.attackCooldown = 1.8;
      const dmg = Math.max(1, Math.round(3 + player.level*0.8 - target.def.def*0.3));
      target.hp -= dmg;
      const wp = target.pos.clone(); wp.y = 1.6*target.def.scale;
      spawnDamageNumberAt(wp, dmg, false, '#8ad8ff');
      updateMonsterBar(target);
      if(target.hp <= 0) killMonster(target);
    }
  }
}

let monsters = [];
let monsterUid = 1;

function spawnMonster(typeKey, x, z, opts){
  opts = opts || {};
  const baseDef = MONSTER_DEFS[typeKey];
  // opts.hpMult/atkMult 로 웨이브 스케일링된 개별 def 복제 (원본 MONSTER_DEFS는 불변 유지)
  const def = (opts.hpMult||opts.atkMult) ? {
    ...baseDef,
    hp: Math.round(baseDef.hp*(opts.hpMult||1)),
    atk: Math.round(baseDef.atk*(opts.atkMult||1)),
  } : baseDef;

  const g = new THREE.Group();
  const bodyColor = def.color;
  let body;
  if(def.shape === 'blob'){
    body = new THREE.Mesh(new THREE.SphereGeometry(0.55*def.scale,10,8), new THREE.MeshStandardMaterial({color:bodyColor, emissive:bodyColor, emissiveIntensity:0.2}));
    body.position.y = 0.65*def.scale;
  } else if(def.shape === 'crystal'){
    body = new THREE.Mesh(new THREE.OctahedronGeometry(0.55*def.scale,0), new THREE.MeshStandardMaterial({color:bodyColor, emissive:bodyColor, emissiveIntensity:0.4, metalness:0.3}));
    body.position.y = 0.9*def.scale;
  } else {
    body = new THREE.Mesh(new THREE.CapsuleGeometry(0.45*def.scale,0.7*def.scale,4,8), new THREE.MeshStandardMaterial({color:bodyColor}));
    body.position.y = 0.8*def.scale;
  }
  body.castShadow = true;
  g.add(body);
  if(def.shape !== 'blob'){
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.32*def.scale,0.5*def.scale,6), new THREE.MeshStandardMaterial({color:bodyColor}));
    head.position.y = (def.shape==='crystal' ? 1.55 : 1.4)*def.scale; head.castShadow = true;
    g.add(head);
  }
  if(def.ranged){
    const bow = new THREE.Mesh(new THREE.TorusGeometry(0.22*def.scale,0.03,6,10,Math.PI), new THREE.MeshStandardMaterial({color:0x3a2a1a}));
    bow.position.set(0.4*def.scale,0.9*def.scale,0); bow.rotation.y = Math.PI/2;
    g.add(bow);
  }
  if(def.isBoss){
    const crown = new THREE.Mesh(new THREE.TorusGeometry(0.3*def.scale,0.06,6,10), new THREE.MeshStandardMaterial({color:0xffd84a, emissive:0xffaa00, emissiveIntensity:0.5}));
    crown.position.y = 1.75*def.scale; crown.rotation.x = Math.PI/2;
    g.add(crown);
  }
  g.position.set(x,0,z);
  scene.add(g);

  // 체력바 (HTML 오버레이, 3D 위치에 투영)
  const barWrap = document.createElement('div');
  barWrap.style.cssText = 'position:absolute;width:50px;height:6px;background:#222;border:1px solid #000;border-radius:2px;pointer-events:none;';
  const barFill = document.createElement('div');
  barFill.style.cssText = 'height:100%;background:#e33;width:100%;';
  barWrap.appendChild(barFill);
  document.getElementById('game-container').appendChild(barWrap);
  const nameTag = document.createElement('div');
  nameTag.style.cssText = 'position:absolute;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap;transform:translate(-50%,-100%);';
  nameTag.textContent = (def.isBoss?'★ ':'')+(opts.nameOverride||def.name);
  document.getElementById('game-container').appendChild(nameTag);

  const m = {
    uid: monsterUid++, type:typeKey, def, mesh:g,
    hp: def.hp, maxHp: def.hp,
    pos: new THREE.Vector3(x,0,z),
    home: new THREE.Vector3(x,0,z),
    wanderTarget: null, wanderTimer: rand(1,3),
    state:'idle', attackCooldown:0,
    barWrap, barFill, nameTag,
    alive:true,
    isDungeon: !!opts.isDungeon,
  };
  monsters.push(m);
  return m;
}

function initialSpawn(){
  const positions = [
    [10,5],[16,-8],[-10,8],[-18,-5],[5,-18],[22,14],[-22,10],[14,20],
    [-8,-20],[20,-15],[-15,18],[8,15],[-24,-12],[26,3]
  ];
  positions.forEach((p,i)=>{
    if(Math.hypot(p[0],p[1]) < TOWN_RADIUS) return; // 마을 안전지대는 스폰 제외
    const type = i%7===0 ? 'archer' : i%7===3 ? 'orc' : i%5===0 ? 'wolf' : 'goblin';
    spawnMonster(type, p[0], p[1]);
  });
  spawnMonster('chief', -30, -30);
}
initialSpawn();

let respawnTimer = 0;

function removeMonster(m){
  scene.remove(m.mesh);
  m.barWrap.remove(); m.nameTag.remove();
  if(m.aggroEl){ m.aggroEl.remove(); m.aggroEl = null; }
  monsters = monsters.filter(x=>x!==m);
}

let lootDrops = []; // {item, mesh, pos}

const RARITY_TIER = { normal:0, magic:1, rare:2, set:3, unique:4 };

function spawnRarityBurst(x, z, colorHex){
  const count = 12;
  for(let i=0;i<count;i++){
    const angle = (i/count)*Math.PI*2 + rand(-0.2,0.2);
    const spark = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6), new THREE.MeshBasicMaterial({color:colorHex, transparent:true, opacity:1}));
    spark.position.set(x, 0.6, z);
    scene.add(spark);
    const dir = { x:Math.cos(angle), y:rand(0.4,0.9), z:Math.sin(angle) };
    const start = performance.now();
    (function anim(){
      const t = (performance.now()-start)/650;
      if(t >= 1){ scene.remove(spark); return; }
      spark.position.x = x + dir.x*t*1.3;
      spark.position.z = z + dir.z*t*1.3;
      spark.position.y = 0.6 + dir.y*t*1.6 - t*t*1.3;
      spark.material.opacity = 1-t;
      requestAnimationFrame(anim);
    })();
  }
}

function spawnLoot(item, x, z){
  const rarityDef = RARITY[item.rarity];
  const color = new THREE.Color(rarityDef.color);
  const tier = RARITY_TIER[item.rarity] || 0;
  const g = new THREE.Group();

  const orb = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.24 + tier*0.05),
    new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.7 + tier*0.15})
  );
  orb.position.y = 0.5;
  const beamHeight = 2.6 + tier*0.7;
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05 + tier*0.015, 0.05 + tier*0.015, beamHeight, 8, 1, true),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.3 + tier*0.09, side:THREE.DoubleSide})
  );
  beam.position.y = beamHeight/2 + 0.15;
  g.add(orb, beam);

  let ring = null;
  if(tier >= 2){
    ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.38 + tier*0.06, 0.03, 6, 20),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.75})
    );
    ring.rotation.x = Math.PI/2;
    ring.position.y = 0.45;
    g.add(ring);
  }

  g.position.set(x, 0, z);
  scene.add(g);

  // 아이템 이름표 (등급별 색상)
  const nameLabel = document.createElement('div');
  nameLabel.className = 'loot-label';
  nameLabel.style.color = rarityDef.color;
  nameLabel.style.textShadow = tier >= 3 ? `0 0 6px ${rarityDef.color}, 0 1px 3px #000` : '0 1px 3px #000';
  nameLabel.textContent = item.name;
  document.getElementById('game-container').appendChild(nameLabel);

  if(tier >= 3){
    spawnRarityBurst(x, z, rarityDef.color);
    spawnToast(`✨ ${rarityDef.label} 아이템 발견: ${item.name}`, rarityDef.color);
    SFX.enhanceSuccess();
  }

  lootDrops.push({ type:'item', item, mesh:g, orb, ring, nameLabel, tier, pos:new THREE.Vector3(x,0,z), t:0 });
}

/* ---------------------------- 원거리 투사체 ---------------------------- */

let projectiles = [];

function monsterShootProjectile(m){
  const dir = new THREE.Vector3().subVectors(playerState.pos, m.pos); dir.y=0; dir.normalize();
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), new THREE.MeshStandardMaterial({color:0x88ff88, emissive:0x338833, emissiveIntensity:0.6}));
  const startPos = m.pos.clone(); startPos.y = 1.1*m.def.scale;
  mesh.position.copy(startPos);
  scene.add(mesh);
  projectiles.push({
    mesh, pos:startPos.clone(), vel:dir.multiplyScalar(m.def.projSpeed||12),
    dmg: m.def.atk, life:2.5,
  });
  SFX.shoot();
}

function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.pos.addScaledVector(p.vel, dt);
    p.mesh.position.copy(p.pos);
    p.life -= dt;
    const hitPlayer = player.alive && p.pos.distanceTo(playerState.pos) < 0.9 && Math.abs(p.pos.y-1.1) < 1.2;
    if(hitPlayer){
      if(!playerState.invulnerable){
        const stats = getTotalStats();
        let dmg = Math.max(1, Math.round(p.dmg*rand(0.85,1.1) - stats.def*0.4));
        dmg = Math.max(1, Math.round(dmg*(1-getDamageReduction())));
        player.hp -= dmg;
        const wp = playerState.pos.clone(); wp.y = 2.2;
        spawnDamageNumberAt(wp, dmg, false, '#8aff8a');
        SFX.playerHurt();
        refreshHUD();
        if(player.hp <= 0) onPlayerDeath();
      } else {
        const wp = playerState.pos.clone(); wp.y = 2.2;
        spawnDamageNumberAt(wp, '회피!', false, '#8ad8ff');
      }
      scene.remove(p.mesh);
      projectiles.splice(i,1);
      continue;
    }
    if(p.life <= 0){
      scene.remove(p.mesh);
      projectiles.splice(i,1);
    }
  }
}

function makePortal(colorHex){

  const ring = new THREE.Mesh(new THREE.TorusGeometry(1.3,0.18,10,24), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:0.8}));
  ring.rotation.x = Math.PI/2; ring.position.y = 1.3;

  disc.rotation.x = -Math.PI/2; disc.position.y = 0.05;

function clampToArenaIfNeeded(){
  if(!player.inDungeon) return;
  let center = DUNGEON_CENTER, radius = ARENA_RADIUS;
  if(dungeonState2.active){ center = DUNGEON2_CENTER; radius = ARENA2_RADIUS; }
  else if(dungeonState3.active){ center = DUNGEON3_CENTER; radius = ARENA3_RADIUS; }
  else if(dungeonState4.active){ center = DUNGEON4_CENTER; radius = ARENA4_RADIUS; }

const DUNGEON_ENTRY = new THREE.Vector3(DUNGEON_CENTER.x, 0, DUNGEON_CENTER.z - ARENA_RADIUS + 3);

function spawnWave(n){
  dungeonState.wave = n;
  showWaveBanner(`웨이브 ${n} / ${DUNGEON_TOTAL_WAVES}`);
  const count = 1 + n; // 웨이브1: 2마리, 웨이브2: 3마리, 웨이브3: 4마리 (점진적 증가)
  const hpMult = 1 + (n-1)*0.35;
  const atkMult = 1 + (n-1)*0.2;
  const archerW = 0.10 + n*0.08, orcW = 0.10 + n*0.08, wolfW = 0.30;
  for(let i=0;i<count;i++){
    let x,z, tries=0;
    do{
      const angle = rand(0,Math.PI*2), r = rand(3,ARENA_RADIUS-3);
      x = DUNGEON_CENTER.x + Math.cos(angle)*r;
      z = DUNGEON_CENTER.z + Math.sin(angle)*r;
      tries++;
    }while(Math.hypot(x-DUNGEON_ENTRY.x, z-DUNGEON_ENTRY.z) < 7 && tries < 10);
    const roll = Math.random();
    const type = roll<archerW ? 'archer' : roll<archerW+orcW ? 'orc' : roll<archerW+orcW+wolfW ? 'wolf' : 'goblin';
    spawnMonster(type, x, z, { isDungeon:true, hpMult, atkMult });
  }
}

function onDungeonMonsterKilled(){
  if(!dungeonState.active) return;
  const remaining = monsters.filter(m=>m.isDungeon).length;
  if(remaining > 0) return;

  if(dungeonState.bossSpawned && !dungeonState.cleared){
    dungeonState.cleared = true;
    dungeonState.bossAlive = false;
    SFX.waveClear();
    showWaveBanner('던전 클리어! 보상을 확인하세요');
    spawnChest(DUNGEON_CENTER.x, DUNGEON_CENTER.z);
    questProgressDungeonClear();
    return;
  }

  if(dungeonState.wave < DUNGEON_TOTAL_WAVES){
    SFX.waveClear();
    setTimeout(()=>{ if(dungeonState.active) spawnWave(dungeonState.wave+1); }, 1800);
  } else if(!dungeonState.bossSpawned){
    SFX.waveClear();
    showWaveBanner('보스 출현!');
    setTimeout(()=>{
      if(!dungeonState.active) return;

    }, 2000);
  }
}

function spawnChest(x,z){
  const g = new THREE.Group();
  const box = new THREE.Mesh(new THREE.BoxGeometry(1.1,0.8,0.8), new THREE.MeshStandardMaterial({color:0x8a5a2a}));
  box.position.y = 0.4; box.castShadow = true;

  lid.position.y = 0.9;
  g.add(box,lid);
  g.position.set(x,0,z);
  scene.add(g);
  chestDrops.push({ mesh:g, pos:new THREE.Vector3(x,0,z), opened:false });

function updateChestPickup(){
  for(const c of chestDrops){
    if(c.opened) continue;
    if(playerState.pos.distanceTo(c.pos) < 1.8){
      c.opened = true;
      scene.remove(c.mesh);
      const gold = randi(80,150);
      addGold(gold);
      spawnToast(`던전 보상: +${gold}G`, '#e8c66a');
      addItemToInventory(forceGoodItem());
      if(Math.random()<0.5){ addItemToInventory(forceGoodItem()); }
      refreshInventoryIfOpen();
    }
  }
}

function projectLabel(el, worldPos, yOffset){
  const wp = worldPos.clone(); wp.y += yOffset;
  const v = wp.project(camera);
  const x = (v.x*0.5+0.5)*window.innerWidth;
  const y = (-v.y*0.5+0.5)*window.innerHeight;
  const visible = v.z < 1 && Math.abs(v.x)<1.3 && Math.abs(v.y)<1.3 && !isInFixedUIArea(x,y);
  el.style.display = visible ? 'block' : 'none';
  if(visible){
    el.style.left = x+'px';
    el.style.top = y+'px';
  }
}

const RECOMMENDED_HP = 150, RECOMMENDED_DEF = 15;
let statWarnCooldown = 0;

function updatePortals(dt){
  entrancePortal.userData.ring.rotation.z += dt*0.6;
  exitPortal.userData.ring.rotation.z += dt*0.6;
  if(keyWarnCooldown > 0) keyWarnCooldown -= dt;
  if(statWarnCooldown > 0) statWarnCooldown -= dt;

  if(!player.inDungeon && !dungeonState.transitioning && player.alive){
    const distToEntrance = playerState.pos.distanceTo(entrancePortal.position);
    if(distToEntrance < 6 && statWarnCooldown <= 0){
      const stats = getTotalStats();
      if(stats.hp < RECOMMENDED_HP || stats.def < RECOMMENDED_DEF){
        spawnToast(`⚠ 권장 사양: 체력 ${RECOMMENDED_HP} 이상, 방어력 ${RECOMMENDED_DEF} 이상`, '#ffd84a');
        statWarnCooldown = 12;
      } else {
        statWarnCooldown = 12;
      }
    }
    if(distToEntrance < 2.2) startDungeon();
  }
  if(player.inDungeon && !dungeonState.transitioning && player.alive){
    if(playerState.pos.distanceTo(exitPortal.position) < 2.2) exitDungeon();
  }

  projectLabel(entranceLabel, entrancePortal.position, 2.6);
  projectLabel(exitLabel, exitPortal.position, 2.6);
}

function spawnWave3(n){
  dungeonState3.wave = n;
  showWaveBanner(`웨이브 ${n} / ${DUNGEON3_TOTAL_WAVES}`);
  const count = 2 + n;
  const hpMult = 1.8 + (n-1)*0.5;
  const atkMult = 1.5 + (n-1)*0.28;
  const seaghostW = 0.18 + n*0.04, drownedW = 0.42;
  for(let i=0;i<count;i++){
    let x,z, tries=0;
    do{
      const angle = rand(0,Math.PI*2), r = rand(3,ARENA3_RADIUS-3);
      x = DUNGEON3_CENTER.x + Math.cos(angle)*r;

    const roll = Math.random();
    const type = roll<seaghostW ? 'seaghost' : roll<seaghostW+drownedW ? 'drowned' : 'orc';
    spawnMonster(type, x, z, { isDungeon:true, hpMult, atkMult });
  }
}

    return;

  if(dungeonState3.wave < DUNGEON3_TOTAL_WAVES){
    SFX.waveClear();
    setTimeout(()=>{ if(dungeonState3.active) spawnWave3(dungeonState3.wave+1); }, 1800);
  } else if(!dungeonState3.bossSpawned){
    SFX.waveClear();
    showWaveBanner('보스 출현!');

      if(!dungeonState3.active) return;

}

// 던전별 최소/권장 레벨 (마을·던전 난이도 곡선을 명시적으로 강제)
const DUNGEON_LEVEL_REQS = {
  dungeon1: { minLevel:1,  recLevel:8,  name:'오크 소굴' },
  dungeon2: { minLevel:12, recLevel:16, name:'심연의 균열' },
  dungeon3: { minLevel:18, recLevel:22, name:'침몰한 유적' },
  dungeon4: { minLevel:24, recLevel:28, name:'모래 무덤' },
};
const levelGateWarnCooldowns = {};
function checkDungeonLevelGate(key){
  const req = DUNGEON_LEVEL_REQS[key];
  const now = performance.now();
  if(player.level < req.minLevel){
    if(!(levelGateWarnCooldowns[key] > now)){
      spawnToast(`🔒 ${req.name} 입장에는 Lv.${req.minLevel} 이상이 필요합니다`, '#ff8a2a');
      levelGateWarnCooldowns[key] = now + 3000;
    }
    return false;
  }
  if(player.level < req.recLevel && !(levelGateWarnCooldowns[key+'_rec'] > now)){
    spawnToast(`⚠ 권장 레벨 Lv.${req.recLevel} 미만입니다. 주의하세요`, '#ffd84a');
    levelGateWarnCooldowns[key+'_rec'] = now + 12000;
  }
  return true;
}

const TOWNS = {
  town1: { id:'town1', name:'크로노스 마을', spawnPos:new THREE.Vector3(0,0,5), minLevel:1, recLevel:1 },
  town2: { id:'town2', name:'항만 마을',     spawnPos:new THREE.Vector3(TOWN2_CENTER.x,0,TOWN2_CENTER.z+5), minLevel:8, recLevel:12 },
  town3: { id:'town3', name:'사막 마을',     spawnPos:new THREE.Vector3(TOWN3_CENTER.x,0,TOWN3_CENTER.z+5), minLevel:16, recLevel:20 },
};

function travelToTown(townId){
  if(player.inDungeon){ spawnToast('던전에서는 이동할 수 없습니다', '#888'); return; }
  const town = TOWNS[townId];
  if(!town || player.currentTown === townId) return;
  if(player.level < town.minLevel){
    spawnToast(`🔒 ${town.name} 이동에는 Lv.${town.minLevel} 이상이 필요합니다`, '#ff8a2a');
    return;
  }
  SFX.portal();
  fadeTransition(()=>{
    player.currentTown = townId;
    playerState.pos.copy(town.spawnPos);
    playerState.moveTarget = null; playerState.targetMonster = null;
    playerMesh.position.copy(playerState.pos);
    camera.position.copy(playerState.pos).add(CAM_OFFSET);
    spawnToast(`${town.name}(으)로 이동했습니다`, '#8ad8ff');
    if(player.level < town.recLevel){
      spawnToast(`⚠ 권장 레벨 Lv.${town.recLevel} 미만입니다. 주의하세요`, '#ffd84a');
    }
    refreshHUD();
    saveGame(true);
  });
}

/* ---------------------------- NPC 상호작용 ---------------------------- */

const INTERACT_RANGE = 2.6;
let nearbyNPC = null;
const npcPanel = document.getElementById('npc-panel');
const questLogPanel = document.getElementById('quest-log-panel');
const codexPanel = document.getElementById('codex-panel');

function isAnyPanelOpen(){
  return !invPanel.classList.contains('hidden') || !npcPanel.classList.contains('hidden') || !questLogPanel.classList.contains('hidden') || !codexPanel.classList.contains('hidden') || !document.getElementById('stat-panel').classList.contains('hidden') || !document.getElementById('skilltree-panel').classList.contains('hidden') || !document.getElementById('combine-panel').classList.contains('hidden') || !document.getElementById('travel-panel').classList.contains('hidden');
}

function updateNPCs(dt){
  let closest = null, closestDist = INTERACT_RANGE;
  for(const n of npcs){
    n.badge.rotation.y += dt*1.5;
    const d = playerState.pos.distanceTo(n.pos);
    if(d < closestDist){ closest = n; closestDist = d; }
    projectLabel(n.nameTag, n.pos, 2.6);
  }
  nearbyNPC = (player.alive && !player.inDungeon) ? closest : null;

  const prompt = document.getElementById('npc-prompt');
  if(nearbyNPC && !isAnyPanelOpen()){
    const wp = nearbyNPC.pos.clone(); wp.y += 2.9;
    const v = wp.project(camera);
    prompt.style.display = 'block';
    prompt.style.left = ((v.x*0.5+0.5)*window.innerWidth)+'px';
    prompt.style.top = ((-v.y*0.5+0.5)*window.innerHeight)+'px';
  } else {
    prompt.style.display = 'none';
  }
}

function renderNPCContent(npc){
  const container = document.getElementById('npc-content');
  container.innerHTML = '';
  let hasContent = false;

  if(npc.role === 'elder' && player.level >= REBIRTH_LEVEL){
    hasContent = true;
    const card = document.createElement('div');
    card.className = 'quest-card';
    card.innerHTML = `<div class="q-title">환생 (${player.rebirths}회 완료)</div>`+
      `<div class="q-desc">레벨을 1로 되돌리는 대신, 영구적으로 모든 능력치가 +${REBIRTH_BONUS_PCT}%p 강해집니다. 장비·골드·퀘스트는 그대로 유지됩니다.</div>`+
      `<div class="q-reward">현재 영구 보너스: +${player.rebirths*REBIRTH_BONUS_PCT}% → 환생 시 +${(player.rebirths+1)*REBIRTH_BONUS_PCT}%</div>`;
    const btn = document.createElement('button');
    btn.textContent = '환생하기';
    btn.onclick = ()=> doRebirth();
    card.appendChild(btn);
    container.appendChild(card);
  }

  if(['merchant','harbor_merchant','desert_merchant'].includes(npc.role)){
    hasContent = true;
    const row = document.createElement('div');
    row.className = 'shop-row';
    const label = document.createElement('span');
    label.textContent = '🧪 체력 포션 (35% 회복)';
    const buyBtn = document.createElement('button');
    buyBtn.textContent = '구매 (30G)';
    buyBtn.disabled = player.gold < 30 || player.potions >= MAX_POTIONS;
    buyBtn.onclick = ()=>{
      if(player.gold < 30 || player.potions >= MAX_POTIONS) return;
      player.gold -= 30;
      addPotion(1);
      renderNPCContent(npc);
    };
    row.appendChild(label); row.appendChild(buyBtn);
    container.appendChild(row);
  }

  if(npc.role === 'blacksmith'){
    hasContent = true;
    const stoneRow = document.createElement('div');
    stoneRow.className = 'shop-row';
    const stoneLabel = document.createElement('span');
    stoneLabel.textContent = `💎 강화석 1개 (보유 ${player.enhanceStones}개)`;
    const stoneBuyBtn = document.createElement('button');
    stoneBuyBtn.textContent = '구매 (50G)';
    stoneBuyBtn.disabled = player.gold < 50;
    stoneBuyBtn.onclick = ()=>{
      if(player.gold < 50) return;
      player.gold -= 50;
      player.enhanceStones += 1;
      spawnToast('강화석 1개 구매', '#8ad8ff');
      refreshHUD();
      renderNPCContent(npc);
    };
    stoneRow.appendChild(stoneLabel); stoneRow.appendChild(stoneBuyBtn);
    container.appendChild(stoneRow);

    const boxRow = document.createElement('div');
    boxRow.className = 'shop-row';
    const boxLabel = document.createElement('span');
    boxLabel.textContent = '📦 장비 상자 (무작위 장비 1개)';
    const boxBuyBtn = document.createElement('button');
    boxBuyBtn.textContent = '구매 (100G)';
    boxBuyBtn.disabled = player.gold < 100 || player.inventory.length >= MAX_INVENTORY;
    boxBuyBtn.onclick = ()=>{
      if(player.gold < 100 || player.inventory.length >= MAX_INVENTORY) return;
      player.gold -= 100;
      addItemToInventory(createRandomItem());
      refreshInventoryIfOpen();
      refreshHUD();
      renderNPCContent(npc);
    };
    boxRow.appendChild(boxLabel); boxRow.appendChild(boxBuyBtn);
    container.appendChild(boxRow);
  }

  const questsForNPC = Object.values(QUEST_DEFS).filter(q=>q.giver===npc.role);
  for(const qd of questsForNPC){
    const qs = player.quests[qd.id];
    const card = document.createElement('div');
    card.className = 'quest-card';
    if(!qs){
      if(!isQuestAvailable(qd)) continue;
      hasContent = true;
      card.innerHTML = `<div class="q-title">${qd.title}</div><div class="q-desc">${qd.desc}</div>`+
        `<div class="q-reward">보상: ${qd.rewardGold}G, 경험치 ${qd.rewardXp}${qd.rewardItem?', 고급 아이템':''}</div>`;
      const btn = document.createElement('button');
      btn.textContent = '수락';
      btn.onclick = ()=>{ acceptQuest(qd.id); renderNPCContent(npc); };
      card.appendChild(btn);
      container.appendChild(card);
    } else if(qs.status==='active'){
      hasContent = true;
      const done = qs.progress >= qd.required;
      card.innerHTML = `<div class="q-title">${qd.title}</div><div class="q-desc">${qd.desc}</div>`+
        `<div class="q-progress">진행도: ${qs.progress}/${qd.required}</div>`;
      const btn = document.createElement('button');
      btn.textContent = done ? '완료 보고' : '진행중...';
      btn.disabled = !done;
      btn.onclick = ()=>{ turnInQuest(qd.id); renderNPCContent(npc); };
      card.appendChild(btn);
      container.appendChild(card);
    } else if(qs.status==='turnedIn'){
      hasContent = true;
      card.innerHTML = `<div class="q-title">${qd.title} ✓</div><div class="q-desc" style="color:#5cff8a;">완료한 퀘스트입니다.</div>`;
      container.appendChild(card);
    }
  }

  if(!hasContent){
    container.innerHTML = '<div id="npc-no-content">지금은 특별히 할 얘기가 없네.</div>';
  }
}

/* ---------------------------- 퀘스트 ---------------------------- */

function isQuestAvailable(qd){
  if(player.quests[qd.id]) return false;
  if(qd.chain==='main' && qd.order>1){
    const prevDef = Object.values(QUEST_DEFS).find(q=>q.chain==='main' && q.order===qd.order-1);
    if(prevDef && player.quests[prevDef.id]?.status !== 'turnedIn') return false;
  }
  if(qd.requiresFlag && !player[qd.requiresFlag]) return false;
  return true;
}

function acceptQuest(id){
  player.quests[id] = { status:'active', progress:0 };
  spawnToast(`퀘스트 수락: ${QUEST_DEFS[id].title}`, '#ffd84a');
  refreshQuestTracker();
}

function questProgressKill(monsterType){
  for(const id in player.quests){
    const qs = player.quests[id];
    if(qs.status !== 'active') continue;
    const qd = QUEST_DEFS[id];
    if(qd.type === 'kill' && qd.monsterType === monsterType){
      qs.progress = Math.min(qd.required, qs.progress+1);
      if(qs.progress >= qd.required) spawnToast(`퀘스트 완료 가능: ${qd.title}`, '#5cff8a');
      refreshQuestTracker();
    }
  }
}

function questProgressDungeonClear(){
  for(const id in player.quests){

    if(qs.status !== 'active') continue;
    const qd = QUEST_DEFS[id];

function turnInQuest(id){
  const qd = QUEST_DEFS[id];
  const qs = player.quests[id];
  if(!qs || qs.progress < qd.required) return;
  qs.status = 'turnedIn';
  addGold(qd.rewardGold);
  addXP(qd.rewardXp);
  if(qd.rewardItem){ addItemToInventory(forceGoodItem()); refreshInventoryIfOpen(); }
  spawnToast(`퀘스트 보상 획득: ${qd.title}`, '#e8c66a');
  refreshQuestTracker();
}

function refreshQuestTracker(){
  const el = document.getElementById('quest-tracker');
  const active = Object.keys(player.quests).filter(id=>player.quests[id].status==='active').map(id=>QUEST_DEFS[id]);
  if(active.length === 0){ el.classList.add('empty'); el.innerHTML=''; return; }
  el.classList.remove('empty');
  el.innerHTML = '<div class="qt-title">📜 진행중인 퀘스트</div>' + active.map(qd=>{
    const qs = player.quests[qd.id];
    const done = qs.progress >= qd.required;
    const hint = done ? '클릭: 보상 받기' : '클릭: 대상 위치로 이동';
    return `<div class="qt-item ${done?'done':''}" data-qid="${qd.id}" title="${hint}">${qd.title} (${qs.progress}/${qd.required})${done?' ✓':''}</div>`;
  }).join('');
  el.querySelectorAll('.qt-item[data-qid]').forEach(row=>{
    row.addEventListener('click', ()=> trackQuest(QUEST_DEFS[row.dataset.qid]));
  });
}

// 진행중인 퀘스트를 클릭하면: 완료된 퀘스트는 즉시 보상 수령, 미완료 킬 퀘스트는 대상 위치로 이동
function trackQuest(qd){
  const qs = player.quests[qd.id];
  if(qs && qs.status === 'active' && qs.progress >= qd.required){
    turnInQuest(qd.id);
    if(!questLogPanel.classList.contains('hidden')) toggleQuestLog();
    return;
  }
  if(qd.type !== 'kill'){
    spawnToast('위치를 표시할 수 없는 퀘스트입니다', '#888');
    return;
  }
  let best = null, bestDist = Infinity;
  for(const m of monsters){
    if(!m.alive || m.type !== qd.monsterType) continue;
    const d = playerState.pos.distanceTo(m.pos);
    if(d < bestDist){ bestDist = d; best = m; }
  }
  if(!best){
    spawnToast(`${MONSTER_DEFS[qd.monsterType].name}이(가) 현재 근처에 없습니다`, '#888');
    return;
  }
  playerState.moveTarget = best.pos.clone();
  playerState.targetMonster = null;
  spawnToast(`${MONSTER_DEFS[qd.monsterType].name} 위치로 이동합니다`, '#8ad8ff');
  if(!questLogPanel.classList.contains('hidden')) toggleQuestLog();
}

function toggleQuestLog(){
  questLogPanel.classList.toggle('hidden');
  if(!questLogPanel.classList.contains('hidden')) renderQuestLog();
}
document.getElementById('ql-close').addEventListener('click', toggleQuestLog);

function renderQuestLog(){
  const body = document.getElementById('quest-log-body');
  const known = Object.keys(player.quests);
  if(known.length === 0){
    body.innerHTML = '<div id="quest-log-empty">아직 수락한 퀘스트가 없습니다. 마을 NPC에게 말을 걸어보세요.</div>';
    return;
  }
  body.innerHTML = known.map(id=>{
    const qd = QUEST_DEFS[id], qs = player.quests[id];
    const done = qs.progress >= qd.required;
    const statusText = qs.status==='turnedIn' ? '완료' : (done ? '완료 가능 (클릭해서 보상 받기)' : '진행중');
    const statusColor = qs.status==='turnedIn' ? '#5cff8a' : (done ? '#ffd84a' : '#8ad8ff');
    const trackable = qs.status==='active' && (done || qd.type==='kill');
    const hint = done ? '클릭: 보상 받기' : '클릭: 대상 위치로 이동';
    return `<div class="quest-card" ${trackable?`data-qid="${qd.id}" style="cursor:pointer;" title="${hint}"`:''}><div class="q-title">${qd.title}</div><div class="q-desc">${qd.desc}</div>`+
      `<div class="q-progress" style="color:${statusColor};">${statusText} (${Math.min(qs.progress,qd.required)}/${qd.required})</div></div>`;
  }).join('');
  body.querySelectorAll('.quest-card[data-qid]').forEach(card=>{
    card.addEventListener('click', ()=> trackQuest(QUEST_DEFS[card.dataset.qid]));
  });
}

const statPanel = document.getElementById('stat-panel');

function allocateStat(stat){
  if(player.statPoints <= 0) return;
  player.statPoints--;
  player.allocatedStats[stat] = (player.allocatedStats[stat]||0) + 1;
  if(stat === 'int'){ player.baseMp += 5; player.mp += 5; }
  if(stat === 'vit'){ player.hp += 4; }
  refreshHUD();
  renderStatPanel();
  saveGame(true);
}

// 버튼을 누르고 있으면 능력치가 계속 자동으로 배분됨
let statRepeatTimeout = null, statRepeatInterval = null;
function startStatRepeat(stat){
  stopStatRepeat();
  allocateStat(stat);
  statRepeatTimeout = setTimeout(()=>{
    statRepeatInterval = setInterval(()=> allocateStat(stat), 110);
  }, 350);
}
function stopStatRepeat(){
  if(statRepeatTimeout){ clearTimeout(statRepeatTimeout); statRepeatTimeout = null; }
  if(statRepeatInterval){ clearInterval(statRepeatInterval); statRepeatInterval = null; }
}
window.addEventListener('mouseup', stopStatRepeat);
window.addEventListener('mouseleave', stopStatRepeat);

function renderStatPanel(){
  const rows = document.getElementById('stat-rows');
  rows.innerHTML = Object.keys(STAT_ALLOC_INFO).map(stat=>{
    const info = STAT_ALLOC_INFO[stat];

      `<div><div class="stat-row-label">${info.label}</div><div class="stat-row-desc">${info.desc}</div></div>`+
      `<div class="stat-row-val">${val}</div>`+
      `<button class="stat-row-btn" data-stat="${stat}" ${player.statPoints<=0?'disabled':''}>+</button>`+
    `</div>`;
  }).join('');
  document.getElementById('stat-points-count').textContent = player.statPoints;
  rows.querySelectorAll('.stat-row-btn').forEach(btn=>{
    btn.addEventListener('mousedown', (e)=>{ e.preventDefault(); startStatRepeat(btn.dataset.stat); });
  });
}

const skilltreePanel = document.getElementById('skilltree-panel');
const SKILL_TREE_ORDER = ['s1','s2','s3','s5','s5b'];

function learnSkillRank(key){
  if(!player.classId || player.skillPoints <= 0) return;
  const reqs = SKILL_TREE_REQS[key];
  const rank = player.skillRanks[key] || 0;
  if(rank >= reqs.length) return;
  const req = reqs[rank];
  if(player.level < req.level || player.rebirths < req.rebirth) return;
  // 배타 그룹(예: 궁극기 s5/s5b) 중 하나를 이미 배웠다면 다른 하나는 초기화 전까지 배울 수 없음
  const group = getExclusiveGroupOf(key);
  if(group && rank===0){
    const other = group.find(k=>k!==key);
    if(player.skillRanks[other] > 0){
      spawnToast('이미 다른 궁극기를 선택했습니다. 초기화 후 다시 선택하세요', '#888');
      return;
    }
  }
  player.skillPoints--;
  player.skillRanks[key] = rank + 1;
  const cls = getClassDef();
  spawnToast(`${cls.skills[key].name} 랭크 ${rank+1} 습득!`, '#5cff8a');
  SFX.levelup();
  refreshHUD();
  renderSkillTree();
  saveGame(true);
}

// 스킬트리 초기화: 투자한 포인트를 전부 환불하고 s1 랭크1만 남긴다 (궁극기 루트 재선택용)
function respecSkillTree(){
  if(!player.classId) return;
  const cost = 50 * player.level;
  if(player.gold < cost){ spawnToast(`골드가 부족합니다 (${cost}G 필요)`, '#888'); return; }
  showConfirm(`스킬트리를 초기화하면 투자한 포인트를 모두 돌려받습니다.\n비용: ${cost}G`, ()=>{
    let refunded = 0;
    for(const key in player.skillRanks){
      refunded += player.skillRanks[key];
      player.skillRanks[key] = 0;
    }
    player.skillRanks.s1 = 1;
    refunded -= 1;
    player.skillPoints += Math.max(0, refunded);
    player.gold -= cost;
    spawnToast(`스킬트리 초기화 완료 (포인트 ${Math.max(0,refunded)}개 환불)`, '#5cff8a');
    refreshHUD();
    renderSkillTree();
    saveGame(true);
  });
}

function renderSkillTree(){
  const cls = getClassDef();
  const rows = document.getElementById('skilltree-rows');
  if(!cls){ rows.innerHTML = '<div style="color:#888;text-align:center;padding:20px 0;">직업을 선택한 후 이용할 수 있습니다.</div>'; return; }
  let html = '';
  let ultimateHeaderShown = false;
  SKILL_TREE_ORDER.forEach(key=>{
    const skill = cls.skills[key];
    if(!skill) return;
    const group = getExclusiveGroupOf(key);
    if(group && !ultimateHeaderShown){
      html += '<div class="combine-section-title">③ 궁극기 선택 (택1 · 한쪽을 배우면 다른 쪽은 초기화 전까지 잠김)</div>';
      ultimateHeaderShown = true;
    }
    const reqs = SKILL_TREE_REQS[key];
    const rank = player.skillRanks[key] || 0;
    const maxRank = reqs.length;
    const maxed = rank >= maxRank;
    const lockedByOther = group && rank===0 && player.skillRanks[group.find(k=>k!==key)] > 0;
    let reqHtml = '';
    let btnHtml = '';
    if(lockedByOther){
      reqHtml = `<div class="skill-row-req unmet">다른 궁극기를 선택함 (초기화 후 선택 가능)</div>`;
      btnHtml = `<button class="skill-row-btn" disabled>선택 불가</button>`;
    } else if(maxed){
      reqHtml = `<div class="skill-row-req">최대 랭크 달성</div>`;
    } else {
      const req = reqs[rank];
      const reqMet = player.level >= req.level && player.rebirths >= req.rebirth;
      const reqText = `다음 랭크 조건: Lv.${req.level}${req.rebirth>0?` · 환생 ${req.rebirth}회`:''}`;
      reqHtml = `<div class="skill-row-req ${reqMet?'':'unmet'}">${reqText}</div>`;
      const canLearn = reqMet && player.skillPoints > 0;
      btnHtml = `<button class="skill-row-btn" data-key="${key}" ${canLearn?'':'disabled'}>${rank===0?'스킬 배우기':'랭크업'} (포인트 1)</button>`;
    }
    html += `<div class="skill-row ${maxed?'maxed':''}">`+
      `<div class="skill-row-top"><span class="skill-row-icon">${skill.icon}</span><span class="skill-row-name">${skill.name}</span><span class="skill-row-rank">${rank}/${maxRank}</span></div>`+
      `<div class="skill-row-desc">${skill.desc||''}</div>`+
      reqHtml + btnHtml +
    `</div>`;
  });
  const respecCost = 50 * player.level;
  html += `<button class="skill-row-btn" id="skilltree-respec-btn" style="border-color:#ff8a8a;color:#ff8a8a;">스킬트리 초기화 (${respecCost}G)</button>`;
  rows.innerHTML = html;
  document.getElementById('skilltree-points-count').textContent = player.skillPoints;
  rows.querySelectorAll('.skill-row-btn[data-key]').forEach(btn=>{
    btn.addEventListener('click', ()=> learnSkillRank(btn.dataset.key));
  });
  const respecBtn = document.getElementById('skilltree-respec-btn');
  if(respecBtn) respecBtn.addEventListener('click', respecSkillTree);
}

function toggleSkillTree(){
  skilltreePanel.classList.toggle('hidden');
  if(!skilltreePanel.classList.contains('hidden')) renderSkillTree();
}
