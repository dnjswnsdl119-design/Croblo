document.getElementById('btn-skilltree').addEventListener('click', toggleSkillTree);

/* ---------------------------- 조합 (보석/룬/융합) ---------------------------- */

const combinePanel = document.getElementById('combine-panel');
let combineActiveTab = 'gem';

function combineGems(gemId, tier){
  const idx = GEM_TIERS.indexOf(tier);
  if(idx < 0 || idx >= GEM_TIERS.length-1) return;
  const matching = player.inventory.filter(i=>i.slot==='gem' && i.gemId===gemId && i.tier===tier).slice(0,3);
  if(matching.length < 3) return;
  const consumeUids = new Set(matching.map(i=>i.uid));
  player.inventory = player.inventory.filter(i=>!consumeUids.has(i.uid));
  const newItem = createGemItem(gemId, GEM_TIERS[idx+1]);
  player.inventory.push(newItem);
  spawnToast(`${matching[0].name} 3개 → ${newItem.name} 조합 성공!`, '#ff8ccf');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

function combineRunes(runeId){
  const idx = RUNE_ORDER.indexOf(runeId);
  if(idx < 0 || idx >= RUNE_ORDER.length-1) return;
  const matching = player.inventory.filter(i=>i.slot==='rune' && i.runeId===runeId).slice(0,3);
  if(matching.length < 3) return;
  const consumeUids = new Set(matching.map(i=>i.uid));
  player.inventory = player.inventory.filter(i=>!consumeUids.has(i.uid));
  const newItem = createRuneItem(RUNE_ORDER[idx+1]);
  player.inventory.push(newItem);
  spawnToast(`${RUNES[runeId].name} 3개 → ${newItem.name} 조합 성공!`, '#c77dff');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

// 이종 보석 혼합: 서로 다른 보석 2개 → 두 스탯을 함께 지닌 혼합석(60% 효율)
function computeMixedGemStats(gemA, gemB){
  const ga = GEMS[gemA.gemId], gb = GEMS[gemB.gemId];
  const stats = { atk:0, def:0, hp:0, crit:0 };
  stats[ga.stat] += gemStatValue(gemA.gemId, gemA.tier) * 0.6;
  stats[gb.stat] += gemStatValue(gemB.gemId, gemB.tier) * 0.6;
  stats.atk = Math.round(stats.atk); stats.def = Math.round(stats.def); stats.hp = Math.round(stats.hp);
  stats.crit = Math.round(stats.crit*10)/10;
  return stats;
}
function createMixedGemItem(gemA, gemB){
  const stats = computeMixedGemStats(gemA, gemB);
  const name = `${GEMS[gemA.gemId].name}-${GEMS[gemB.gemId].name} 혼합석`;
  return { uid:itemUid++, name, slot:'fusion', rarity:'fusion', fusionStats:stats, base:{}, enhance:0,
    flavor:'서로 다른 두 보석의 기운이 뒤섞여 하나가 되었다.' };
}
function combineMixedGem(uidA, uidB){
  if(uidA === uidB) return;
  const gemA = player.inventory.find(i=>i.uid===uidA && i.slot==='gem');
  const gemB = player.inventory.find(i=>i.uid===uidB && i.slot==='gem');
  if(!gemA || !gemB || gemA.gemId===gemB.gemId) return;
  player.inventory = player.inventory.filter(i=>i.uid!==gemA.uid && i.uid!==gemB.uid);
  const item = createMixedGemItem(gemA, gemB);
  player.inventory.push(item);
  spawnToast(`${item.name} 조합 성공!`, '#ff8ccf');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

// 룬 역합성: 룬 1개 → 하위 단계 룬 2개로 분해 (조합의 역방향, 유연성 확보용)
function splitRune(runeId){
  const idx = RUNE_ORDER.indexOf(runeId);
  if(idx <= 0) return;
  const item = player.inventory.find(i=>i.slot==='rune' && i.runeId===runeId);
  if(!item) return;
  player.inventory = player.inventory.filter(i=>i.uid!==item.uid);
  const lowerId = RUNE_ORDER[idx-1];
  player.inventory.push(createRuneItem(lowerId));
  player.inventory.push(createRuneItem(lowerId));
  spawnToast(`${RUNES[runeId].name} 1개 → ${RUNES[lowerId].name} 2개로 분해!`, '#c77dff');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

// 상급 융합: 보석 2개 + 룬 1개 → 더 강력한 각인석
function computeAdvancedFusionStats(gemA, gemB, runeItem){
  const rs = RUNES[runeItem.runeId].stats;
  const stats = { atk:rs.atk||0, def:rs.def||0, hp:rs.hp||0, crit:rs.crit||0 };
  stats[GEMS[gemA.gemId].stat] += gemStatValue(gemA.gemId, gemA.tier);
  stats[GEMS[gemB.gemId].stat] += gemStatValue(gemB.gemId, gemB.tier);
  stats.atk = Math.round(stats.atk); stats.def = Math.round(stats.def); stats.hp = Math.round(stats.hp);
  stats.crit = Math.round(stats.crit*10)/10;
  return stats;
}
function createAdvancedFusionItem(gemA, gemB, runeItem){
  const stats = computeAdvancedFusionStats(gemA, gemB, runeItem);
  const name = `상급 각인석 (${GEMS[gemA.gemId].name}·${GEMS[gemB.gemId].name}·${RUNES[runeItem.runeId].name.replace(' 룬','')})`;
  return { uid:itemUid++, name, slot:'fusion', rarity:'fusion', fusionStats:stats, base:{}, enhance:0,
    flavor:'두 보석과 룬의 힘이 응축된 강력한 각인석.' };
}
function doAdvancedFusion(){
  const gemASel = document.getElementById('adv-gem-a-select');
  const gemBSel = document.getElementById('adv-gem-b-select');
  const runeSel = document.getElementById('adv-rune-select');
  if(!gemASel || !gemBSel || !runeSel) return;
  const uidA = Number(gemASel.value), uidB = Number(gemBSel.value), runeUid = Number(runeSel.value);
  if(uidA === uidB){ spawnToast('서로 다른 보석 2개를 선택하세요', '#888'); return; }
  const gemA = player.inventory.find(i=>i.uid===uidA && i.slot==='gem');
  const gemB = player.inventory.find(i=>i.uid===uidB && i.slot==='gem');
  const runeItem = player.inventory.find(i=>i.uid===runeUid && i.slot==='rune');
  if(!gemA || !gemB || !runeItem) return;
  player.inventory = player.inventory.filter(i=>i.uid!==gemA.uid && i.uid!==gemB.uid && i.uid!==runeItem.uid);
  const item = createAdvancedFusionItem(gemA, gemB, runeItem);
  player.inventory.push(item);
  spawnToast(`${item.name} 융합 성공!`, '#ffb347');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

function doFusion(){
  const gemSel = document.getElementById('fusion-gem-select');
  const runeSel = document.getElementById('fusion-rune-select');
  if(!gemSel || !runeSel) return;
  const gemUid = Number(gemSel.value), runeUid = Number(runeSel.value);
  const gemItem = player.inventory.find(i=>i.uid===gemUid && i.slot==='gem');
  const runeItem = player.inventory.find(i=>i.uid===runeUid && i.slot==='rune');
  if(!gemItem || !runeItem) return;
  player.inventory = player.inventory.filter(i=>i.uid!==gemItem.uid && i.uid!==runeItem.uid);
  const fusionItem = createFusionItem(gemItem, runeItem);
  player.inventory.push(fusionItem);
  spawnToast(`${fusionItem.name} 융합 성공!`, '#ffb347');
  SFX.enhanceSuccess();
  renderInventory(); renderCombinePanel(); refreshHUD(); saveGame(true);
}

function renderCombineGemTab(){
  const body = document.getElementById('combine-body');
  const gemItems = player.inventory.filter(i=>i.slot==='gem');
  const groups = {};
  gemItems.forEach(i=>{
    const key = i.gemId+'|'+i.tier;
    groups[key] = (groups[key]||0)+1;
  });
  const upgradeRows = [];
  Object.keys(GEMS).forEach(gemId=>{
    GEM_TIERS.slice(0,-1).forEach(tier=>{
      const count = groups[gemId+'|'+tier]||0;
      if(count>0) upgradeRows.push({ gemId, tier, count });
    });
  });

  let html = '<div class="combine-section-title">① 동일 보석 승급 (3개 → 상위 등급 1개)</div>';
  if(upgradeRows.length===0){
    html += '<div class="combine-empty">보유한 보석이 없습니다. 몬스터를 처치해 보석을 획득하세요.</div>';
  } else {
    html += upgradeRows.map(r=>{
      const g = GEMS[r.gemId];
      const nextTier = GEM_TIERS[GEM_TIERS.indexOf(r.tier)+1];
      return `<div class="combine-row">
        <div class="combine-row-info">
          <div class="combine-row-name" style="color:${g.color};">${GEM_TIER_LABELS[r.tier]} ${g.name} x${r.count}</div>
          <div class="combine-row-desc">3개 → ${GEM_TIER_LABELS[nextTier]} ${g.name} 1개</div>
        </div>
        <button class="combine-row-btn" data-gem="${r.gemId}" data-tier="${r.tier}" ${r.count>=3?'':'disabled'}>조합하기</button>
      </div>`;
    }).join('');
  }

  html += '<div class="combine-section-title">② 이종 보석 혼합 (서로 다른 보석 2개 → 두 능력치를 함께 지닌 혼합석)</div>';
  if(gemItems.length < 2){
    html += '<div class="combine-empty">보석이 2개 이상 필요합니다.</div>';
  } else {
    html += `<div id="combine-fusion-pickers">
      <select id="mix-gem-a-select">${gemItems.map(g=>`<option value="${g.uid}">${g.name}</option>`).join('')}</select>
      <select id="mix-gem-b-select">${gemItems.map(g=>`<option value="${g.uid}">${g.name}</option>`).join('')}</select>
    </div>
    <div id="mix-gem-preview" class="combine-preview"></div>
    <button class="combine-row-btn" id="mix-gem-btn" style="width:100%;">혼합하기 (서로 다른 종류의 보석 2개 소모)</button>`;
  }

  body.innerHTML = html;
  body.querySelectorAll('.combine-row-btn[data-gem]').forEach(btn=>{
    btn.addEventListener('click', ()=> combineGems(btn.dataset.gem, btn.dataset.tier));
  });
  if(gemItems.length >= 2){
    const labels = { atk:'공격력', def:'방어력', hp:'체력', crit:'치명타%' };
    const updateMixPreview = ()=>{
      const uidA = Number(document.getElementById('mix-gem-a-select').value);
      const uidB = Number(document.getElementById('mix-gem-b-select').value);
      const gemA = gemItems.find(g=>g.uid===uidA), gemB = gemItems.find(g=>g.uid===uidB);
      const previewEl = document.getElementById('mix-gem-preview');
      const btn = document.getElementById('mix-gem-btn');
      if(!gemA || !gemB || gemA.gemId===gemB.gemId){
        previewEl.textContent = gemA && gemB && gemA.gemId===gemB.gemId ? '서로 다른 종류의 보석을 선택하세요' : '';
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      const stats = computeMixedGemStats(gemA, gemB);
      const text = Object.entries(stats).filter(([,v])=>v).map(([k,v])=>`${labels[k]} +${v}${k==='crit'?'%':''}`).join(', ');
      previewEl.textContent = '결과 능력치: ' + text;
    };
    document.getElementById('mix-gem-a-select').addEventListener('change', updateMixPreview);
    document.getElementById('mix-gem-b-select').addEventListener('change', updateMixPreview);
    document.getElementById('mix-gem-btn').addEventListener('click', ()=>{
      combineMixedGem(Number(document.getElementById('mix-gem-a-select').value), Number(document.getElementById('mix-gem-b-select').value));
    });
    updateMixPreview();
  }
}

function renderCombineRuneTab(){
  const body = document.getElementById('combine-body');
  const groups = {};
  player.inventory.filter(i=>i.slot==='rune').forEach(i=>{ groups[i.runeId] = (groups[i.runeId]||0)+1; });
  const upgradeRows = RUNE_ORDER.slice(0,-1).map(runeId=>({runeId, count:groups[runeId]||0})).filter(r=>r.count>0);
  const splitRows = RUNE_ORDER.slice(1).map(runeId=>({runeId, count:groups[runeId]||0})).filter(r=>r.count>0);

  let html = '<div class="combine-section-title">① 동일 룬 승급 (3개 → 다음 단계 룬 1개)</div>';
  if(upgradeRows.length===0){
    html += '<div class="combine-empty">보유한 룬이 없습니다. 몬스터를 처치해 룬을 획득하세요.</div>';
  } else {
    html += upgradeRows.map(r=>{
      const rd = RUNES[r.runeId];
      const nextRune = RUNES[RUNE_ORDER[RUNE_ORDER.indexOf(r.runeId)+1]];
      return `<div class="combine-row">
        <div class="combine-row-info">
          <div class="combine-row-name" style="color:${rd.color};">${rd.name} x${r.count}</div>
          <div class="combine-row-desc">3개 → ${nextRune.name} 1개</div>
        </div>
        <button class="combine-row-btn" data-rune="${r.runeId}" ${r.count>=3?'':'disabled'}>조합하기</button>
      </div>`;
    }).join('');
  }

  html += '<div class="combine-section-title">② 룬 역합성 (룬 1개 → 하위 단계 룬 2개로 분해)</div>';
  if(splitRows.length===0){
    html += '<div class="combine-empty">분해할 수 있는 룬이 없습니다 (엘 룬은 더 분해할 수 없습니다).</div>';
  } else {
    html += splitRows.map(r=>{
      const rd = RUNES[r.runeId];
      const lowerRune = RUNES[RUNE_ORDER[RUNE_ORDER.indexOf(r.runeId)-1]];
      return `<div class="combine-row">
        <div class="combine-row-info">
          <div class="combine-row-name" style="color:${rd.color};">${rd.name} x${r.count}</div>
          <div class="combine-row-desc">1개 → ${lowerRune.name} 2개</div>
        </div>
        <button class="combine-row-btn" data-split="${r.runeId}">분해하기</button>
      </div>`;
    }).join('');
  }

  body.innerHTML = html;
  body.querySelectorAll('.combine-row-btn[data-rune]').forEach(btn=>{
    btn.addEventListener('click', ()=> combineRunes(btn.dataset.rune));
  });
  body.querySelectorAll('.combine-row-btn[data-split]').forEach(btn=>{
    btn.addEventListener('click', ()=> splitRune(btn.dataset.split));
  });
}

function renderCombineFusionTab(){
  const body = document.getElementById('combine-body');
  const gems = player.inventory.filter(i=>i.slot==='gem');
  const runes = player.inventory.filter(i=>i.slot==='rune');
  const labels = { atk:'공격력', def:'방어력', hp:'체력', crit:'치명타%' };

  let html = '<div class="combine-section-title">① 기본 융합 (보석 1개 + 룬 1개 → 각인석)</div>';
  if(gems.length===0 || runes.length===0){
    html += '<div class="combine-empty">보석과 룬을 각각 최소 1개씩 보유해야 융합할 수 있습니다.</div>';
  } else {
    html += `<div id="combine-fusion-pickers">
      <select id="fusion-gem-select">${gems.map(g=>`<option value="${g.uid}">${g.name}</option>`).join('')}</select>
      <select id="fusion-rune-select">${runes.map(r=>`<option value="${r.uid}">${r.name}</option>`).join('')}</select>
    </div>
    <div id="combine-fusion-preview" class="combine-preview"></div>
    <button class="combine-row-btn" id="fusion-btn" style="width:100%;">융합하기 (보석 1개 + 룬 1개 소모)</button>`;

  html += '<div class="combine-section-title">② 상급 융합 (서로 다른 보석 2개 + 룬 1개 → 강화된 각인석)</div>';
  if(gems.length < 2 || runes.length===0){
    html += '<div class="combine-empty">서로 다른 보석 2개와 룬 1개가 필요합니다.</div>';
  } else {
    html += `<div id="adv-fusion-pickers">
      <select id="adv-gem-a-select">${gems.map(g=>`<option value="${g.uid}">${g.name}</option>`).join('')}</select>
      <select id="adv-gem-b-select">${gems.map(g=>`<option value="${g.uid}">${g.name}</option>`).join('')}</select>
      <select id="adv-rune-select">${runes.map(r=>`<option value="${r.uid}">${r.name}</option>`).join('')}</select>
    </div>
    <div id="adv-fusion-preview" class="combine-preview"></div>
    <button class="combine-row-btn" id="adv-fusion-btn" style="width:100%;">상급 융합하기 (보석 2개 + 룬 1개 소모)</button>`;
  }

  body.innerHTML = html;

  if(gems.length>0 && runes.length>0){
    const updatePreview = ()=>{
      const gemUid = Number(document.getElementById('fusion-gem-select').value);
      const runeUid = Number(document.getElementById('fusion-rune-select').value);
      const gemItem = gems.find(g=>g.uid===gemUid);
      const runeItem = runes.find(r=>r.uid===runeUid);
      const previewEl = document.getElementById('combine-fusion-preview');
      if(!gemItem || !runeItem){ previewEl.textContent=''; return; }
      const stats = computeFusionStats(gemItem, runeItem);
      const text = Object.entries(stats).filter(([,v])=>v).map(([k,v])=>`${labels[k]} +${v}${k==='crit'?'%':''}`).join(', ');
      previewEl.textContent = '결과 능력치: ' + text;
    };
    document.getElementById('fusion-gem-select').addEventListener('change', updatePreview);
    document.getElementById('fusion-rune-select').addEventListener('change', updatePreview);
    document.getElementById('fusion-btn').addEventListener('click', doFusion);
    updatePreview();
  }

  if(gems.length>=2 && runes.length>0){
    const updateAdvPreview = ()=>{
      const uidA = Number(document.getElementById('adv-gem-a-select').value);
      const uidB = Number(document.getElementById('adv-gem-b-select').value);
      const runeUid = Number(document.getElementById('adv-rune-select').value);
      const gemA = gems.find(g=>g.uid===uidA), gemB = gems.find(g=>g.uid===uidB);
      const runeItem = runes.find(r=>r.uid===runeUid);
      const previewEl = document.getElementById('adv-fusion-preview');
      const btn = document.getElementById('adv-fusion-btn');
      if(!gemA || !gemB || !runeItem || uidA===uidB){
        previewEl.textContent = gemA && gemB && uidA===uidB ? '서로 다른 보석 2개를 선택하세요' : '';
        btn.disabled = true;
        return;
      }
      btn.disabled = false;
      const stats = computeAdvancedFusionStats(gemA, gemB, runeItem);
      const text = Object.entries(stats).filter(([,v])=>v).map(([k,v])=>`${labels[k]} +${v}${k==='crit'?'%':''}`).join(', ');
      previewEl.textContent = '결과 능력치: ' + text;
    };
    document.getElementById('adv-gem-a-select').addEventListener('change', updateAdvPreview);
    document.getElementById('adv-gem-b-select').addEventListener('change', updateAdvPreview);
    document.getElementById('adv-rune-select').addEventListener('change', updateAdvPreview);
    document.getElementById('adv-fusion-btn').addEventListener('click', doAdvancedFusion);
    updateAdvPreview();
  }
}

function renderCombinePanel(){
  if(combineActiveTab==='gem') renderCombineGemTab();
  else if(combineActiveTab==='rune') renderCombineRuneTab();
  else renderCombineFusionTab();
}

function toggleCombinePanel(){
  combinePanel.classList.toggle('hidden');
  if(!combinePanel.classList.contains('hidden')) renderCombinePanel();
}
document.getElementById('combine-close').addEventListener('click', toggleCombinePanel);
document.getElementById('btn-combine').addEventListener('click', toggleCombinePanel);
document.querySelectorAll('.combine-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.combine-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    combineActiveTab = btn.dataset.tab;
    renderCombinePanel();
  });
});

const travelPanel = document.getElementById('travel-panel');

function renderTravelPanel(){
  const rows = document.getElementById('travel-rows');
  const inDungeon = player.inDungeon;
  rows.innerHTML = Object.values(TOWNS).map(t=>{
    const isCurrent = player.currentTown === t.id;
    const belowMin = player.level < t.minLevel;
    const belowRec = player.level < t.recLevel;
    const reqText = t.minLevel<=1 ? '' :
      `<div class="travel-row-req ${belowMin?'unmet':''}">최소 Lv.${t.minLevel} · 권장 Lv.${t.recLevel}</div>`;
    return `<div class="travel-row">
      <div><span class="travel-row-name">${t.name}${isCurrent?' (현재 위치)':''}</span>${reqText}</div>
      <button class="travel-row-btn" data-town="${t.id}" ${(isCurrent||inDungeon||belowMin)?'disabled':''}>이동하기</button>
    </div>`;
  }).join('');
  if(inDungeon){
    rows.innerHTML = '<div class="combine-empty">던전 안에서는 마을로 이동할 수 없습니다. 먼저 귀환 포탈로 나가세요.</div>' + rows.innerHTML;
  }
  rows.querySelectorAll('.travel-row-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ travelToTown(btn.dataset.town); toggleTravelPanel(); });
  });
}

function toggleTravelPanel(){
  travelPanel.classList.toggle('hidden');
  if(!travelPanel.classList.contains('hidden')) renderTravelPanel();
}
document.getElementById('travel-close').addEventListener('click', toggleTravelPanel);
document.getElementById('btn-travel').addEventListener('click', toggleTravelPanel);

/* ---------------------------- 입력 처리 ---------------------------- */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function getMonsterMeshes(){ return monsters.map(m=>m.mesh); }

canvas.addEventListener('pointerdown', (e)=>{
  if(!player.alive || !player.classId) return;
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);

  const monsterHits = raycaster.intersectObjects(getMonsterMeshes(), true);
  if(monsterHits.length>0){
    let obj = monsterHits[0].object;
    while(obj.parent && !monsters.find(m=>m.mesh===obj)) obj = obj.parent;
    const target = monsters.find(m=>m.mesh===obj);
    if(target){
      if(playerState.mounted) toggleMount();
      playerState.targetMonster = target;
      playerState.moveTarget = null;
      return;
    }
  }

  const npcHits = raycaster.intersectObjects(npcs.map(n=>n.mesh), true);
  if(npcHits.length>0){
    let obj = npcHits[0].object;
    while(obj.parent && !npcs.find(n=>n.mesh===obj)) obj = obj.parent;
    const npc = npcs.find(n=>n.mesh===obj);
    if(npc){
      playerState.moveTarget = npc.pos.clone();
      playerState.targetMonster = null;
      return;
    }
  }

  let floorMesh = ground;
  if(dungeonState2.active && arenaGround2) floorMesh = arenaGround2;
  else if(dungeonState3.active && arenaGround3) floorMesh = arenaGround3;
  else if(dungeonState4.active && arenaGround4) floorMesh = arenaGround4;
  else if(player.inDungeon && arenaGround) floorMesh = arenaGround;
  else if(player.currentTown === 'town2' && townGround2) floorMesh = townGround2;
  else if(player.currentTown === 'town3' && townGround3) floorMesh = townGround3;
  const groundHits = raycaster.intersectObject(floorMesh);
  if(groundHits.length>0){
    playerState.moveTarget = groundHits[0].point.clone();
    playerState.targetMonster = null;
  }
});

function spawnDamageNumberAt(worldPos, text, crit, colorOverride){
  const v = worldPos.clone().project(camera);
  const x = (v.x*0.5+0.5)*window.innerWidth;
  const y = (-v.y*0.5+0.5)*window.innerHeight;
  const el = document.createElement('div');
  el.className = 'dmg-text' + (crit?' crit':'');
  if(colorOverride) el.style.color = colorOverride;
  el.style.left = (x+rand(-10,10))+'px';
  el.style.top = y+'px';
  el.textContent = text;
  document.getElementById('fx-layer').appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

// 몬스터가 선공(어그로)을 시작할 때 머리 위에 "!" 표시 (몬스터를 따라 위치 갱신됨, updateBars 참고)
function spawnAggroIndicator(m){
  if(m.aggroEl) m.aggroEl.remove();
  const el = document.createElement('div');
  el.className = 'aggro-alert';
  el.textContent = '!';
  document.getElementById('fx-layer').appendChild(el);
  m.aggroEl = el;
  setTimeout(()=>{
    el.remove();
    if(m.aggroEl === el) m.aggroEl = null;
  }, 900);
}

function getAttackRange(){
  const cls = getClassDef();
  return cls && cls.ranged ? cls.range : 2.0;
}

// 매지션은 마법 데미지가 상대 방어력을 무시하고 그대로 들어간다 (크로노스 원작 매지션 특성)
function getDefPenetration(){
  return player.classId === 'magician' ? 0 : 1;
}

function playerAttack(monster){
  const stats = getTotalStats();
  const isCrit = Math.random()*100 < stats.crit;
  let realDmg = Math.max(1, Math.round(stats.atk*rand(0.85,1.15) - monster.def.def*0.5*getDefPenetration()));
  if(isCrit) realDmg = Math.round(realDmg*1.8);
  monster.hp -= realDmg;
  const worldPos = monster.pos.clone(); worldPos.y = 2.0*monster.def.scale;
  spawnDamageNumberAt(worldPos, realDmg, isCrit);
  updateMonsterBar(monster);
  if(isCrit) SFX.crit(); else SFX.hit();
  if(monster.hp > 0) SFX.monsterHurt();
  if(getClassDef()?.ranged) spawnCastBolt(playerState.pos, monster.pos, 0x8a5aff);

  // 넉백/타격 이펙트: 살짝 스케일 펄스
  monster.mesh.scale.set(1.15,0.85,1.15);
  setTimeout(()=>{ if(monster.mesh) monster.mesh.scale.set(1,1,1); }, 120);

  if(monster.hp <= 0){
    killMonster(monster);
  }
}

function killMonster(monster){
  monster.alive = false;
  SFX.monsterDeath();
  const dropX = monster.pos.x, dropZ = monster.pos.z;
  addXP(monster.def.xp);
  if(!player.discoveredMonsters.includes(monster.type)) player.discoveredMonsters.push(monster.type);
  const gold = randi(monster.def.goldMin, monster.def.goldMax);
  spawnGoldPickup(gold, dropX, dropZ);

  // 보스는 확정 세트/유니크 드랍 확률 상승
  const dropChance = monster.def.isBoss ? 1.0 : 0.55;
  if(Math.random() < dropChance){
    const item = monster.def.isBoss ? forceGoodItem() : createRandomItem();
    spawnLoot(item, dropX + rand(-0.5,0.5), dropZ + rand(-0.5,0.5));
  }
  if(!monster.def.isBoss && Math.random() < 0.22){
    spawnPotionPickup(dropX + rand(-0.6,0.6), dropZ + rand(-0.6,0.6));
  }
  if(Math.random() < (monster.def.isBoss ? 0.5 : 0.08)){
    dropRandomRune(dropX + rand(-0.7,0.7), dropZ + rand(-0.7,0.7));
  }
  if(Math.random() < (monster.def.isBoss ? 0.5 : 0.1)){
    dropRandomGem(dropX + rand(-0.7,0.7), dropZ + rand(-0.7,0.7));
  }
  if(monster.type === 'chief' && !player.hasDungeonKey){
    player.hasDungeonKey = true;
    spawnToast('오크 소굴 열쇠 획득! 이제 던전에 입장할 수 있습니다', '#c9a0ff');
  }
  if(monster.type === 'orclord' && !player.hasAbyssKey){
    player.hasAbyssKey = true;
    spawnToast('심연의 인장 획득! 이제 심연의 균열에 입장할 수 있습니다', '#2ad9c4');
  }
  questProgressKill(monster.type);
  if(playerState.targetMonster === monster) playerState.targetMonster = null;
  const wasDungeon = monster.isDungeon;
  removeMonster(monster);
  if(wasDungeon){ onDungeonMonsterKilled(); onDungeon2MonsterKilled(); onDungeon3MonsterKilled(); onDungeon4MonsterKilled(); }
}

function forceGoodItem(){
  // 보스 전용: 세트 또는 유니크 확정
  if(Math.random()<0.5){
    const setDef = choice(Object.values(SETS));
    const slot = choice(Object.keys(setDef.pieces));
    const piece = setDef.pieces[slot];
    return { uid:itemUid++, name:piece.name, slot, rarity:'set', setId:setDef.id, setName:setDef.name, base:{...piece.base}, enhance:0,
      sockets: SOCKET_COUNT_BY_RARITY.set, runes:[] };
  } else {
    const u = choice(UNIQUES);
    return { uid:itemUid++, name:u.name, slot:u.slot, rarity:'unique', base:{...u.base}, flavor:u.flavor, enhance:0,
      sockets: SOCKET_COUNT_BY_RARITY.unique, runes:[] };
  }
}

function updateMonsterBar(m){
  m.barFill.style.width = Math.max(0,(m.hp/m.maxHp*100))+'%';
}

function monsterAttackPlayer(m){
  if(playerState.invulnerable){
    const wp = playerState.pos.clone(); wp.y = 2.2;
    spawnDamageNumberAt(wp, '회피!', false, '#8ad8ff');
    return;
  }
  const stats = getTotalStats();
  let dmg = Math.max(1, Math.round(m.def.atk*rand(0.8,1.2) - stats.def*0.4));
  dmg = Math.max(1, Math.round(dmg*(1-getDamageReduction())));
  player.hp -= dmg;
  const wp = playerState.pos.clone(); wp.y = 2.2;
  spawnDamageNumberAt(wp, dmg, false, '#ff5c5c');
  SFX.playerHurt();
  refreshHUD();
  if(player.hp <= 0) onPlayerDeath();
}

function onPlayerDeath(){
  player.alive = false;
  playerState.targetMonster = null;
  playerState.moveTarget = null;
  document.getElementById('death-screen').classList.remove('hidden');
}
document.getElementById('btn-respawn').addEventListener('click', ()=>{

  player.hp = getTotalStats().hp;

    player.inDungeon = false;
    setAtmosphere(false);
    dungeonState.active = false;
    dungeonState2.active = false;

// 플레이어가 장애물 충돌 여유 반경 안에 놓여있게 되는 경우(끼임) 부드럽게 밀어냄
function resolveStuckPosition(){
  for(const o of obstacles){
    const dx = playerState.pos.x - o.pos.x, dz = playerState.pos.z - o.pos.z;
    const d = Math.hypot(dx,dz);
    const minDist = o.radius + 0.5;
    if(d < minDist && d > 0.0001){
      const push = (minDist - d) + 0.02;
      playerState.pos.x += (dx/d)*push;
      playerState.pos.z += (dz/d)*push;
    }
  }
}

function updatePlayer(dt){
  if(!player.classId) return;
  resolveStuckPosition();
  // 회피 대시 / 스킬 쿨다운, 버프 타이머 갱신
  if(playerState.dodgeCooldown > 0) playerState.dodgeCooldown -= dt;
  if(skillState.s1.cd > 0) skillState.s1.cd -= dt;
  if(skillState.s2.cd > 0) skillState.s2.cd -= dt;
  if(skillState.s3.cd > 0) skillState.s3.cd -= dt;
  if(skillState.s4.cd > 0) skillState.s4.cd -= dt;
  if(skillState.s5.cd > 0) skillState.s5.cd -= dt;
  if(skillState.s5b.cd > 0) skillState.s5b.cd -= dt;
  if(basicAttackState.cd > 0) basicAttackState.cd -= dt;
  ['atk','def','dmgReduction','speed'].forEach(k=>{
    if(player.buffTimers[k] > 0){
      player.buffTimers[k] -= dt;
      if(player.buffTimers[k] <= 0){ player.buffTimers[k] = 0; refreshHUD(); }
    }
  });
  const regen = getClassDef()?.mpRegen || 4;
  if(player.mp < player.baseMp){
    player.mp = Math.min(player.baseMp, player.mp + regen*dt);
  }

  if(playerState.dodging){
    playerState.dodgeTimeLeft -= dt;
    const step = DODGE_SPEED*dt;
    const nx = playerState.pos.x + playerState.dodgeDir.x*step;
    const nz = playerState.pos.z + playerState.dodgeDir.z*step;
    if(!collides(nx,nz,0.5)){ playerState.pos.x = nx; playerState.pos.z = nz; }
    clampToArenaIfNeeded();
    playerMesh.position.copy(playerState.pos);
    if(playerState.dodgeTimeLeft <= 0){
      playerState.dodging = false;
      playerState.invulnerable = false;
    }
    return;
  }

  // 키보드 이동 (WASD / 방향키) - 클릭 이동/전투보다 우선
  const kbDir = getKeyboardMoveDir();
  if(kbDir){
    playerState.moveTarget = null;
    playerState.targetMonster = null;
    const step = getMoveSpeed()*dt;
    const nx = playerState.pos.x + kbDir.x*step;
    const nz = playerState.pos.z + kbDir.z*step;
    if(!collides(nx,nz,0.5)){ playerState.pos.x = nx; playerState.pos.z = nz; }
    else if(!collides(nx, playerState.pos.z, 0.5)){ playerState.pos.x = nx; }
    else if(!collides(playerState.pos.x, nz, 0.5)){ playerState.pos.z = nz; }
    clampToArenaIfNeeded();
    playerMesh.rotation.y = Math.atan2(kbDir.x, kbDir.z);
    playerState.facing.copy(kbDir);
    playerMesh.position.copy(playerState.pos);
    return;
  }

  // 몬스터 추적 중이면
  if(playerState.targetMonster && playerState.targetMonster.alive){
    const t = playerState.targetMonster;
    const d = playerState.pos.distanceTo(t.pos);
    const atkRange = getAttackRange();
    if(d > atkRange){
      moveToward(t.pos, dt, atkRange*0.85);
    } else {
      // 공격 사거리 안 - 몬스터 바라보기
      facePosition(t.pos);
      playerState.attackCooldown -= dt;
      if(playerState.attackCooldown <= 0){
        playerAttack(t);
        playerState.attackCooldown = 0.7;
      }
    }
  } else if(playerState.moveTarget){
    const d = playerState.pos.distanceTo(playerState.moveTarget);
    if(d > 0.15){
      moveToward(playerState.moveTarget, dt, 0);
    } else {
      playerState.moveTarget = null;
    }
  }
  playerMesh.position.copy(playerState.pos);
}

function moveToward(target, dt, stopDist){
  const dir = new THREE.Vector3().subVectors(target, playerState.pos);
  dir.y = 0;
  const dist = dir.length();
  if(dist < 0.001) return;
  dir.normalize();
  const step = Math.min(dist-stopDist, getMoveSpeed()*dt);
  if(step <= 0) return;
  const nx = playerState.pos.x + dir.x*step;
  const nz = playerState.pos.z + dir.z*step;
  if(!collides(nx,nz,0.5)){
    playerState.pos.x = nx; playerState.pos.z = nz;
  } else if(!collides(nx, playerState.pos.z, 0.5)){
    playerState.pos.x = nx;
  } else if(!collides(playerState.pos.x, nz, 0.5)){
    playerState.pos.z = nz;
  }
  clampToArenaIfNeeded();
  facePosition(target);
}

function facePosition(target){
  const dx = target.x - playerState.pos.x, dz = target.z - playerState.pos.z;
  if(Math.hypot(dx,dz) < 0.001) return;
  playerMesh.rotation.y = Math.atan2(dx,dz);
  playerState.facing.set(dx,0,dz).normalize();
}

function updateMonsters(dt){
  for(const m of monsters){
    if(!m.alive) continue;
    const distToPlayer = m.pos.distanceTo(playerState.pos);

    if(m.def.isBoss && !bossWarned && distToPlayer < 20){
      bossWarned = true;
      const el = document.getElementById('boss-warning');
      el.classList.add('show');
      setTimeout(()=>el.classList.remove('show'), 2500);
    }

    if(player.alive && distToPlayer < m.def.aggro){
      if(m.state !== 'chase') spawnAggroIndicator(m);
      m.state = 'chase';
    } else if(m.pos.distanceTo(m.home) > 14){
      m.state = 'return';
    }

    if(m.state === 'chase' && player.alive && m.def.ranged){
      const dir = new THREE.Vector3().subVectors(playerState.pos, m.pos); dir.y=0;
      const dist = dir.length();
      if(dist > m.def.range){
        dir.normalize();
        const step = Math.min(dist-m.def.range+1, m.def.speed*dt);
        if(step>0){ const nx=m.pos.x+dir.x*step, nz=m.pos.z+dir.z*step; if(!collides(nx,nz,0.5*m.def.scale)){ m.pos.x=nx; m.pos.z=nz; } }
        m.mesh.rotation.y = Math.atan2(dir.x,dir.z);
      } else if(dist < m.def.minRange){
        dir.normalize();
        const step = Math.min(m.def.minRange-dist, m.def.speed*dt);
        const nx=m.pos.x-dir.x*step, nz=m.pos.z-dir.z*step;
        if(!collides(nx,nz,0.5*m.def.scale)){ m.pos.x=nx; m.pos.z=nz; }
        m.mesh.rotation.y = Math.atan2(dir.x,dir.z);
      } else {
        m.mesh.rotation.y = Math.atan2(dir.x,dir.z);
        m.attackCooldown -= dt;
        if(m.attackCooldown <= 0){
          monsterShootProjectile(m);
          m.attackCooldown = 1.7;
        }
      }
    } else if(m.state === 'chase' && player.alive){
      if(distToPlayer > 1.8){
        const dir = new THREE.Vector3().subVectors(playerState.pos, m.pos); dir.y=0;
        const dist = dir.length(); dir.normalize();
        const step = Math.min(dist-1.6, m.def.speed*dt);
        if(step>0){
          const nx = m.pos.x+dir.x*step, nz = m.pos.z+dir.z*step;
          if(!collides(nx,nz,0.5*m.def.scale)){ m.pos.x=nx; m.pos.z=nz; }
        }
        m.mesh.rotation.y = Math.atan2(dir.x,dir.z);
      } else {
        m.attackCooldown -= dt;
        if(m.attackCooldown <= 0){
          monsterAttackPlayer(m);
          m.attackCooldown = 1.1;
        }
      }
    } else if(m.state === 'return'){
      const dir = new THREE.Vector3().subVectors(m.home, m.pos); dir.y=0;
      const dist = dir.length();
      if(dist < 0.3){ m.state='idle'; }
      else { dir.normalize(); const step=Math.min(dist,m.def.speed*dt); m.pos.x+=dir.x*step; m.pos.z+=dir.z*step; }
    } else {
      // idle wander
      m.wanderTimer -= dt;
      if(m.wanderTimer <= 0){
        m.wanderTimer = rand(2,5);
        const angle = rand(0,Math.PI*2), r = rand(1,4);
        m.wanderTarget = new THREE.Vector3(m.home.x+Math.cos(angle)*r, 0, m.home.z+Math.sin(angle)*r);
      }
      if(m.wanderTarget){
        const dir = new THREE.Vector3().subVectors(m.wanderTarget, m.pos); dir.y=0;
        const dist = dir.length();
        if(dist > 0.2){
          dir.normalize();
          const step = Math.min(dist, m.def.speed*0.4*dt);
          const nx=m.pos.x+dir.x*step, nz=m.pos.z+dir.z*step;
          if(!collides(nx,nz,0.5*m.def.scale)){ m.pos.x=nx; m.pos.z=nz; }
          m.mesh.rotation.y = Math.atan2(dir.x,dir.z);
        }
      }
    }
    m.mesh.position.copy(m.pos);
  }
}

function updateCamera(){
  const desired = playerState.pos.clone().add(CAM_OFFSET);
  camera.position.lerp(desired, 0.12);
  const lookAt = playerState.pos.clone(); lookAt.y += 1;
  camera.lookAt(lookAt);
}

function removeLootDrop(l, i){
  scene.remove(l.mesh);
  if(l.nameLabel) l.nameLabel.remove();
  lootDrops.splice(i,1);
}

function updateLootPickup(){
  for(let i=lootDrops.length-1;i>=0;i--){
    const l = lootDrops[i];
    l.t += 0.016;
    l.orb.position.y = 0.5 + Math.sin(l.t*2)*0.12;
    l.mesh.rotation.y += 0.02;
    if(l.ring) l.ring.rotation.z += 0.04;

    if(l.nameLabel){
      const wp = l.pos.clone(); wp.y = 1.3 + (l.tier||0)*0.18;
      const v = wp.project(camera);
      const x = (v.x*0.5+0.5)*window.innerWidth;
      const y = (-v.y*0.5+0.5)*window.innerHeight;
      const visible = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && !isInFixedUIArea(x,y);
      l.nameLabel.style.display = visible ? 'block' : 'none';
      if(visible){ l.nameLabel.style.left = x+'px'; l.nameLabel.style.top = y+'px'; }
    }

    if(playerState.pos.distanceTo(l.pos) < 1.4){
      if(l.type === 'potion'){
        if(player.potions < MAX_POTIONS){
          addPotion(1);
          removeLootDrop(l, i);
        }
      } else {
        const ok = addItemToInventory(l.item);
        if(ok){
          removeLootDrop(l, i);
          refreshInventoryIfOpen();
        }
      }
    }
  }
}

function isInFixedUIArea(x, y){
  const w = window.innerWidth, h = window.innerHeight;
  if(x < 300 && y < 220) return true;                  // 좌상단 HUD + 퀘스트 트래커
  if(Math.abs(x-w/2) < 150 && y < 110) return true;     // 타겟 프레임
  if(x > w-220 && y < 180) return true;                 // 미니맵
  if(x > w-490 && y > h-140) return true;               // 우하단 액션 슬롯
  if(Math.abs(x-w/2) < 140 && y > h-150) return true;   // 하단 중앙 HP/MP 오브 + 버프열
  if(x < 420 && y > h-40) return true;                  // 좌하단 조작 안내
  return false;
}

function updateBars(){
  for(const m of monsters){
    const wp = m.pos.clone(); wp.y = 2.1*m.def.scale;
    const v = wp.project(camera);
    const x = (v.x*0.5+0.5)*window.innerWidth;
    const y = (-v.y*0.5+0.5)*window.innerHeight;
    const inUIArea = isInFixedUIArea(x, y);
    const visible = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && !inUIArea;
    m.barWrap.style.display = visible ? 'block':'none';
    m.nameTag.style.display = visible ? 'block':'none';
    m.barWrap.style.left = (x-25)+'px';
    m.barWrap.style.top = y+'px';
    m.nameTag.style.left = x+'px';
    m.nameTag.style.top = (y-4)+'px';
    if(m.aggroEl){
      m.aggroEl.style.display = visible ? 'block':'none';
      m.aggroEl.style.left = x+'px';
      m.aggroEl.style.top = (y-30)+'px';
    }
  }
}

const SAVE_KEY = 'chronosSoulSave_v1';
let lastSaveTime = 0;

function saveGame(force){
  if(!gameLoaded) return;
  const now = Date.now();
  if(!force && now - lastSaveTime < 3000) return;
  lastSaveTime = now;
  const data = {
    version: 1,
    classId: player.classId,
    level: player.level, xp: player.xp, xpToNext: player.xpToNext,
    baseHp: player.baseHp, baseAtk: player.baseAtk, baseDef: player.baseDef, baseCrit: player.baseCrit,
    baseMp: player.baseMp, rebirths: player.rebirths,
    gold: player.gold, potions: player.potions, enhanceStones: player.enhanceStones,
    hasDungeonKey: player.hasDungeonKey, hasAbyssKey: player.hasAbyssKey,
    inventory: player.inventory,
    equipment: player.equipment,
    quests: player.quests,
    discoveredMonsters: player.discoveredMonsters,
    statPoints: player.statPoints,
    allocatedStats: player.allocatedStats,
    junkThreshold: player.junkThreshold,
    skillPoints: player.skillPoints,
    skillRanks: player.skillRanks,
    currentTown: player.currentTown,
  };
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(data)); }catch(e){ /* 저장 공간 없음: 무시 */ }
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || data.version !== 1) return false;
    player.classId = data.classId || null;
    player.level = data.level||1; player.xp = data.xp||0; player.xpToNext = data.xpToNext||50;
    player.baseHp = data.baseHp||100; player.baseAtk = data.baseAtk||10;
    player.baseDef = data.baseDef||5; player.baseCrit = data.baseCrit||5;
    player.baseMp = data.baseMp||50;
    player.rebirths = data.rebirths||0;
    player.gold = data.gold||0; player.potions = data.potions||0; player.enhanceStones = data.enhanceStones||0;
    player.hasDungeonKey = !!data.hasDungeonKey;
    player.hasAbyssKey = !!data.hasAbyssKey;
    player.inventory = data.inventory || [];
    player.equipment = Object.assign(
      { weapon:null, armor:null, accessory:null, helmet:null, gloves:null, boots:null, belt:null },
      data.equipment || {}
    );
    player.quests = data.quests || {};
    player.discoveredMonsters = data.discoveredMonsters || [];
    player.statPoints = data.statPoints || 0;
    player.allocatedStats = Object.assign({ str:0, agi:0, int:0, vit:0 }, data.allocatedStats || {});
    player.junkThreshold = JUNK_RARITY_OPTIONS.includes(data.junkThreshold) ? data.junkThreshold : 'magic';
    // 스킬트리 도입 이전 세이브는 s1/s2/s3를 이미 쓰던 것으로 간주해 랭크1로 승계, 신규 필살기(s5)만 새로 습득해야 함
    player.skillPoints = data.skillPoints || 0;
    player.skillRanks = data.skillRanks
      ? Object.assign({ s1:0, s2:0, s3:0, s5:0, s5b:0 }, data.skillRanks)
      : { s1:1, s2:1, s3:1, s5:0, s5b:0 };
    player.currentTown = TOWNS[data.currentTown] ? data.currentTown : 'town1';
    player.hp = player.baseHp;
    player.mp = player.baseMp;

    let maxUid = 0;
    player.inventory.forEach(i=>{ if(i && i.uid>maxUid) maxUid = i.uid; });
    Object.values(player.equipment).forEach(i=>{ if(i && i.uid>maxUid) maxUid = i.uid; });
    if(maxUid >= itemUid) itemUid = maxUid+1;

    return true;
  }catch(e){ return false; }
}

const MINIMAP_RANGE = 30;
function updateMinimap(){
  const inner = document.getElementById('minimap-inner');
  inner.innerHTML = '';
  const cx = 75, cy = 75;
  const scale = 75/MINIMAP_RANGE;
  const addDot = (wx, wz, cls)=>{
    const dx = (wx - playerState.pos.x)*scale;
    const dz = (wz - playerState.pos.z)*scale;
    if(Math.hypot(dx,dz) > 75) return;
    const dot = document.createElement('div');
    dot.className = 'mm-dot '+cls;
    dot.style.left = (cx+dx)+'px'; dot.style.top = (cy+dz)+'px';
    inner.appendChild(dot);
  };
  monsters.forEach(m=>{
    if(!m.alive) return;
    if(!!m.isDungeon !== !!player.inDungeon) return;
    addDot(m.pos.x, m.pos.z, 'mm-monster');
  });
  if(dungeonState2.active){
    addDot(exitPortal2.position.x, exitPortal2.position.z, 'mm-portal');
  } else if(dungeonState3.active){
    addDot(exitPortal3.position.x, exitPortal3.position.z, 'mm-portal');
  } else if(dungeonState4.active){
    addDot(exitPortal4.position.x, exitPortal4.position.z, 'mm-portal');
  } else if(player.inDungeon){
    addDot(exitPortal.position.x, exitPortal.position.z, 'mm-portal');
  } else {
    npcs.forEach(n=> addDot(n.pos.x, n.pos.z, 'mm-npc'));
    addDot(entrancePortal.position.x, entrancePortal.position.z, 'mm-portal');
    addDot(entrancePortal2.position.x, entrancePortal2.position.z, 'mm-portal');
    addDot(entrancePortal3.position.x, entrancePortal3.position.z, 'mm-portal');
    addDot(entrancePortal4.position.x, entrancePortal4.position.z, 'mm-portal');
  }
  const pdot = document.createElement('div');
  pdot.className = 'mm-dot mm-player';
  pdot.style.left = cx+'px'; pdot.style.top = cy+'px';
  inner.appendChild(pdot);
}

      }
      if(item.sockets > 0){
        const used = socketUsedCount(item);
        const sockBadge = document.createElement('div');
        sockBadge.className = 'socket-count-badge';
        sockBadge.textContent = `🔮${used}/${item.sockets}`;
        sockBadge.title = `소켓 ${used}/${item.sockets}`;
        div.appendChild(sockBadge);
      }
      if(isUpgrade(item)){
        div.classList.add('upgrade');
        const upBadge = document.createElement('button');
        upBadge.className = 'upgrade-badge';
        upBadge.textContent = '⬆';
        upBadge.title = '더 강한 장비입니다. 클릭하면 즉시 장착됩니다.';
        upBadge.onclick = (e)=>{ e.stopPropagation(); quickEquip(item); };
        div.appendChild(upBadge);
      }
      if(selectedItem && selectedItem.item.uid===item.uid) div.classList.add('selected');
      div.onclick = ()=> selectItem(item,'inv');
      div.addEventListener('mousemove', (e)=>showTooltip(e,item));
      div.addEventListener('mouseleave', hideTooltip);
    }
    grid.appendChild(div);
  }

  renderCharStats();
}

function renderCharStats(){
  const s = getTotalStats();
  const el = document.getElementById('char-stats');
  el.innerHTML = `
    <div>공격력</div><div>${s.atk}</div>
    <div>방어력</div><div>${s.def}</div>
    <div>체력</div><div>${s.hp}</div>
    <div>치명타</div><div>${s.crit.toFixed(1)}%</div>
    <div>골드</div><div>${player.gold}</div>
    <div>레벨</div><div>${player.level}</div>
    ${player.statPoints>0?`<div style="color:var(--gold);">분배 가능</div><div style="color:var(--gold);">${player.statPoints}P</div>`:''}
  `;
}

function selectItem(item, from){
  selectedItem = { item, from };
  renderInventory();
  renderDetail();
}

function renderDetail(){
  const empty = document.getElementById('detail-empty');
  const content = document.getElementById('detail-content');
  if(!selectedItem){ empty.style.display='block'; content.style.display='none'; return; }
  empty.style.display='none'; content.style.display='block';
  const item = selectedItem.item;
  const isRune = item.slot === 'rune';
  const isGem = item.slot === 'gem';
  const isFusion = item.slot === 'fusion';
  const isSocketable = isRune || isGem || isFusion;
  const rc = isGem ? GEMS[item.gemId].color : RARITY[item.rarity].color;

  document.getElementById('detail-name').textContent = (item.enhance>0?`+${item.enhance} `:'')+item.name;
  document.getElementById('detail-name').style.color = rc;
  document.getElementById('detail-type').textContent = isGem
    ? `${SLOT_LABEL[item.slot]} · ${GEM_TIER_LABELS[item.tier]}`
    : `${SLOT_LABEL[item.slot]} · ${RARITY[item.rarity].label}${item.setName?' · '+item.setName:''}`;

  if(isRune){
    const rd = RUNES[item.runeId];
    const labels = { atk:'공격력', def:'방어력', hp:'체력', crit:'치명타%' };
    const statsText = Object.entries(rd.stats).map(([k,v])=>`${labels[k]||k} +${v}${k==='crit'?'%':''}`).join('<br>');
    document.getElementById('detail-stats').innerHTML = statsText + `<br><i style="color:#888;">"${rd.flavor}"</i>`;
  } else if(isGem){
    const g = GEMS[item.gemId];
    const val = gemStatValue(item.gemId, item.tier);
    const label = GEM_STAT_LABELS[g.stat];
    document.getElementById('detail-stats').innerHTML = `${label} +${g.stat==='crit'?val.toFixed(1):Math.round(val)}${g.stat==='crit'?'%':''}`;
  } else if(isFusion){
    const labels = { atk:'공격력', def:'방어력', hp:'체력', crit:'치명타%' };
    const statsText = Object.entries(item.fusionStats||{}).filter(([,v])=>v).map(([k,v])=>`${labels[k]||k} +${v}${k==='crit'?'%':''}`).join('<br>');
    document.getElementById('detail-stats').innerHTML = statsText + (item.flavor?`<br><i style="color:#888;">"${item.flavor}"</i>`:'');
  } else {
    document.getElementById('detail-stats').innerHTML = itemStatsText(item) + (item.flavor?`<br><i style="color:#888;">"${item.flavor}"</i>`:'');
  }

  const setInfo = document.getElementById('detail-set-info');
  if(item.setId){
    setInfo.innerHTML = SETS[item.setId].bonuses.map(b=>b.desc).join('<br>');
  } else { setInfo.innerHTML=''; }

  renderSocketSection(item, isSocketable);

  const isEquipped = selectedItem.from !== 'inv';
  const upgradeHint = document.getElementById('detail-upgrade-hint');
  const itemIsUpgrade = !isEquipped && !isSocketable && isUpgrade(item);
  upgradeHint.classList.toggle('hidden', !itemIsUpgrade);
  const equipBtn = document.getElementById('btn-equip');
  equipBtn.style.display = (isEquipped || isSocketable) ? 'none':'inline-block';
  equipBtn.classList.toggle('upgrade', itemIsUpgrade);
  equipBtn.textContent = itemIsUpgrade ? '⬆ 즉시 장착' : '장착';
  document.getElementById('btn-unequip').style.display = isEquipped ? 'inline-block':'none';
  const disBtn = document.getElementById('btn-disassemble');
  disBtn.style.display = (isEquipped || isSocketable) ? 'none' : 'inline-block';
  disBtn.textContent = `🔨 분해 (강화석 +${DISASSEMBLE_YIELD[item.rarity]||1})`;
  const sellBtn = document.getElementById('btn-sell');
  sellBtn.style.display = isEquipped ? 'none' : 'inline-block';
  sellBtn.textContent = `🪙 판매 (${getSellValue(item)}G)`;

  // 강화 정보 (룬/보석은 강화 불가)
  const enhanceInfoEl = document.getElementById('enhance-info');
  const enhanceBtn = document.getElementById('btn-enhance');
  const stoneBtn = document.getElementById('btn-use-stone');
  if(isSocketable){
    enhanceInfoEl.innerHTML = '';
    enhanceBtn.style.display = 'none';
    stoneBtn.style.display = 'none';
  } else {
    enhanceBtn.style.display = 'inline-block';
    const chance = Math.round(enhanceChance(item.enhance)*100);
    const cost = enhanceCost(item.enhance);
    const maxed = item.enhance >= MAX_ENHANCE;
    enhanceInfoEl.innerHTML = maxed
      ? '최대 강화 단계입니다 (+15)'
      : `성공 확률 ${chance}% · 비용 ${cost} G ${item.enhance>=10?'<br><span style="color:#ff8080;">⚠ +10 이상 실패 시 단계 하락 위험</span>':''}`;
    enhanceBtn.disabled = maxed || player.gold < cost;
    stoneBtn.style.display = maxed ? 'none' : 'inline-block';
    stoneBtn.disabled = player.enhanceStones < STONE_COST_GUARANTEE || player.gold < cost;
  }
  document.getElementById('enhance-result').textContent = '';
}

// 디아블로 스타일 룬 소켓 UI: 장비는 보유 소켓/삽입된 룬을 보여주고, 룬은 삽입 가능한 장비 목록을 보여준다
function socketUsedCount(eq){
  return (eq.runes?eq.runes.length:0) + (eq.gems?eq.gems.length:0) + (eq.fusions?eq.fusions.length:0);
}

function renderSocketSection(item, isSocketable){
  const el = document.getElementById('socket-info');
  if(isSocketable){
    const kind = item.slot; // 'rune' | 'gem' | 'fusion'
    const rows = [];
    for(const slot in player.equipment){
      const eq = player.equipment[slot];
      if(!eq || !eq.sockets) continue;
      const used = socketUsedCount(eq);
      rows.push({ slot, eq, used, open: used < eq.sockets });
    }
    const label = kind==='gem' ? '💎 보석' : kind==='fusion' ? '✨ 각인석' : '🔮 룬';
    if(rows.length === 0){
      el.innerHTML = `<div class="socket-title">${label}</div><div style="color:#888;">소켓이 있는 장비를 착용하면 이 아이템을 삽입할 수 있습니다.</div>`;
      return;
    }
    el.innerHTML = `<div class="socket-title">${label} 소켓에 삽입할 장비 선택</div>` + rows.map(r=>
      `<div class="socket-target-row"><span>${r.eq.name} (${r.used}/${r.eq.sockets})</span><button data-slot="${r.slot}" ${r.open?'':'disabled'}>삽입</button></div>`
    ).join('');
    el.querySelectorAll('button[data-slot]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(kind==='gem') insertGem(btn.dataset.slot);
        else if(kind==='fusion') insertFusion(btn.dataset.slot);
        else insertRune(btn.dataset.slot);
      });
    });
  } else {
    if(!item.sockets){ el.innerHTML=''; return; }
    const used = socketUsedCount(item);
    let pips = '';
    for(let i=0;i<item.sockets;i++) pips += `<span class="socket-pip ${i<used?'filled':''}"></span>`;
    const runeNames = (item.runes||[]).map(id=>RUNES[id]?.name).filter(Boolean);
    const gemNames = (item.gems||[]).map(g=>`${GEM_TIER_LABELS[g.tier]} ${GEMS[g.gemId]?.name}`);
    const fusionNames = (item.fusions||[]).map((f,i)=>`각인석${i+1}`);
    const names = [...runeNames, ...gemNames, ...fusionNames].join(', ');
    el.innerHTML = `<div class="socket-title">🔮 소켓 ${used}/${item.sockets}</div>${pips}${names?`<div style="margin-top:4px;">삽입됨: ${names}</div>`:''}`;
  }
}

function insertRune(targetSlot){
  if(!selectedItem || selectedItem.item.slot !== 'rune') return;
  const runeItem = selectedItem.item;
  const eq = player.equipment[targetSlot];
  if(!eq || !eq.sockets) return;
  if(!eq.runes) eq.runes = [];
  if(socketUsedCount(eq) >= eq.sockets) return;
  eq.runes.push(runeItem.runeId);
  player.inventory = player.inventory.filter(i=>i.uid!==runeItem.uid);
  spawnToast(`${RUNES[runeItem.runeId].name} 삽입: ${eq.name}`, '#c77dff');
  selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
}

function insertGem(targetSlot){
  if(!selectedItem || selectedItem.item.slot !== 'gem') return;
  const gemItem = selectedItem.item;
  const eq = player.equipment[targetSlot];
  if(!eq || !eq.sockets) return;
  if(!eq.gems) eq.gems = [];
  if(socketUsedCount(eq) >= eq.sockets) return;
  eq.gems.push({ gemId:gemItem.gemId, tier:gemItem.tier });
  player.inventory = player.inventory.filter(i=>i.uid!==gemItem.uid);
  spawnToast(`${gemItem.name} 삽입: ${eq.name}`, '#ff8ccf');
  selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
}

function insertFusion(targetSlot){
  if(!selectedItem || selectedItem.item.slot !== 'fusion') return;
  const fusionItem = selectedItem.item;
  const eq = player.equipment[targetSlot];
  if(!eq || !eq.sockets) return;
  if(!eq.fusions) eq.fusions = [];
  if(socketUsedCount(eq) >= eq.sockets) return;
  eq.fusions.push({ ...fusionItem.fusionStats });
  player.inventory = player.inventory.filter(i=>i.uid!==fusionItem.uid);
  spawnToast(`${fusionItem.name} 삽입: ${eq.name}`, '#ffb347');
  selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
}

function equipItem(item){
  const slot = item.slot;
  const old = player.equipment[slot];
  player.equipment[slot] = item;
  player.inventory = player.inventory.filter(i=>i.uid!==item.uid);
  if(old) player.inventory.push(old);
  selectedItem = { item, from:slot };
  renderInventory(); renderDetail(); refreshHUD();
}

// 인벤토리 그리드의 업그레이드 배지 클릭 시: 상세 패널을 거치지 않고 바로 장착
function quickEquip(item){
  equipItem(item);
  spawnToast(`${item.name} 즉시 장착!`, '#5cff8a');
}

document.getElementById('btn-equip').addEventListener('click', ()=>{
  if(!selectedItem || selectedItem.from!=='inv') return;
  equipItem(selectedItem.item);
});

document.getElementById('btn-unequip').addEventListener('click', ()=>{
  if(!selectedItem || selectedItem.from==='inv') return;
  const slot = selectedItem.from;
  const item = player.equipment[slot];
  if(!item) return;
  if(player.inventory.length >= MAX_INVENTORY){ spawnToast('인벤토리가 가득 찼습니다','#888'); return; }
  player.equipment[slot] = null;
  player.inventory.push(item);
  selectedItem = { item, from:'inv' };
  renderInventory(); renderDetail(); refreshHUD();
});

document.getElementById('btn-enhance').addEventListener('click', ()=>{
  if(!selectedItem) return;
  const item = selectedItem.item;
  if(item.enhance >= MAX_ENHANCE) return;
  const cost = enhanceCost(item.enhance);
  if(player.gold < cost) return;
  player.gold -= cost;
  const success = Math.random() < enhanceChance(item.enhance);
  const resultEl = document.getElementById('enhance-result');
  if(success){
    item.enhance++;
    resultEl.style.color = '#4a9eff';
    resultEl.textContent = `강화 성공! +${item.enhance}`;
    spawnToast(`강화 성공: ${item.name} +${item.enhance}`, '#4a9eff');
    SFX.enhanceSuccess();
  } else {
    let downgraded = false;
    if(item.enhance >= 10 && Math.random() < 0.3){
      item.enhance = Math.max(0,item.enhance-1);
      downgraded = true;
    }
    resultEl.style.color = '#ff5c5c';
    resultEl.textContent = downgraded ? `강화 실패... 단계 하락 (+${item.enhance})` : '강화 실패...';
    spawnToast('강화 실패', '#ff5c5c');
    SFX.enhanceFail();
  }
  renderInventory(); renderDetail(); refreshHUD();
});

document.getElementById('btn-disassemble').addEventListener('click', ()=>{
  if(!selectedItem || selectedItem.from!=='inv') return;
  const item = selectedItem.item;
  const yield_ = DISASSEMBLE_YIELD[item.rarity]||1;
  player.inventory = player.inventory.filter(i=>i.uid!==item.uid);
  player.enhanceStones += yield_;
  spawnToast(`${item.name} 분해: 강화석 +${yield_}`, '#8ad8ff');
  selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
});

document.getElementById('btn-sell').addEventListener('click', ()=>{
  if(!selectedItem || selectedItem.from!=='inv') return;
  const item = selectedItem.item;
  const value = getSellValue(item);
  player.inventory = player.inventory.filter(i=>i.uid!==item.uid);
  addGold(value);
  spawnToast(`${item.name} 판매: +${value}G`, '#e8c66a');
  selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
});

// 현재 설정된 잡템 기준(player.junkThreshold) 이하 등급 아이템을 한번에 판매
function sellJunkItems(){
  const maxTier = RARITY_TIER[player.junkThreshold];
  const junk = player.inventory.filter(i=>RARITY_TIER[i.rarity] !== undefined && RARITY_TIER[i.rarity] <= maxTier);
  if(junk.length===0){ spawnToast('판매할 잡템이 없습니다', '#888'); return 0; }
  const total = junk.reduce((sum,i)=>sum+(SELL_VALUE[i.rarity]||8),0);
  const junkUids = new Set(junk.map(i=>i.uid));
  player.inventory = player.inventory.filter(i=>!junkUids.has(i.uid));
  addGold(total);
  spawnToast(`잡템 ${junk.length}개 판매: +${total}G`, '#e8c66a');
  if(selectedItem && selectedItem.from==='inv' && !player.inventory.includes(selectedItem.item)) selectedItem = null;
  renderInventory(); renderDetail(); refreshHUD();
  return junk.length;
}

document.getElementById('btn-sell-junk').addEventListener('click', sellJunkItems);

const junkSelect = document.getElementById('junk-threshold-select');
JUNK_RARITY_OPTIONS.forEach(key=>{
  const opt = document.createElement('option');
  opt.value = key;
  opt.textContent = `${RARITY[key].label} 이하`;
  junkSelect.appendChild(opt);
});
junkSelect.addEventListener('change', ()=>{
  player.junkThreshold = junkSelect.value;
  saveGame(true);
});

document.getElementById('btn-use-stone').addEventListener('click', ()=>{
  if(!selectedItem) return;
  const item = selectedItem.item;
  if(item.enhance >= MAX_ENHANCE) return;
  if(player.enhanceStones < STONE_COST_GUARANTEE){ spawnToast('강화석이 부족합니다', '#888'); return; }
  const cost = enhanceCost(item.enhance);
  if(player.gold < cost){ spawnToast('골드가 부족합니다', '#888'); return; }
  player.gold -= cost;
  player.enhanceStones -= STONE_COST_GUARANTEE;
  item.enhance++;
  const resultEl = document.getElementById('enhance-result');
  resultEl.style.color = '#8ad8ff';
  resultEl.textContent = `강화석으로 확정 성공! +${item.enhance}`;
  spawnToast(`강화 확정 성공: ${item.name} +${item.enhance}`, '#8ad8ff');
  SFX.enhanceSuccess();
  renderInventory(); renderDetail(); refreshHUD();
});

/* ---- 툴팁 (인벤토리 밖에서는 사용 안 함, 그리드 내 hover만) ---- */
const tooltipEl = document.getElementById('tooltip');
function showTooltip(e, item){
  tooltipEl.style.display = 'block';
  tooltipEl.style.left = (e.clientX+16)+'px';
  tooltipEl.style.top = (e.clientY+8)+'px';
  const rc = item.slot === 'gem' ? GEMS[item.gemId].color : RARITY[item.rarity].color;
  let statsHtml, typeLine;
  if(item.slot === 'rune'){
    const rd = RUNES[item.runeId];
    const labels = { atk:'공격력', def:'방어력', hp:'체력', crit:'치명타%' };
    statsHtml = Object.entries(rd.stats).map(([k,v])=>`${labels[k]||k} +${v}${k==='crit'?'%':''}`).join('<br>');
    typeLine = `${SLOT_LABEL[item.slot]} · ${RARITY[item.rarity].label}`;
  } else if(item.slot === 'gem'){
    const g = GEMS[item.gemId];
    const val = gemStatValue(item.gemId, item.tier);
    statsHtml = `${GEM_STAT_LABELS[g.stat]} +${g.stat==='crit'?val.toFixed(1):Math.round(val)}${g.stat==='crit'?'%':''}`;
    typeLine = `${SLOT_LABEL[item.slot]} · ${GEM_TIER_LABELS[item.tier]}`;
  } else {
    statsHtml = itemStatsText(item);
    typeLine = `${SLOT_LABEL[item.slot]} · ${RARITY[item.rarity].label}`;
  }
  tooltipEl.innerHTML = `<b style="color:${rc};">${item.enhance>0?'+'+item.enhance+' ':''}${item.name}</b><br>
    <span style="color:#999;">${typeLine}</span><br>${statsHtml}`;
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }

/* ---------------------------- 리스폰 (몬스터 주기적 재생성) ---------------------------- */
setInterval(()=>{
  const overworldCount = monsters.filter(m=>!m.isDungeon).length;
  if(overworldCount < 24){
    const angle = rand(0,Math.PI*2), r = rand(15,40);
    const x = Math.cos(angle)*r, z = Math.sin(angle)*r;
    if(!collides(x,z,1)){
      const roll = Math.random();
      const type = roll<0.12?'archer':roll<0.24?'orc':roll<0.5?'wolf':'goblin';
      spawnMonster(type, x, z);
    }
  }
}, 1800);
